name: CI

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce staging to main
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "main" && \
                "${{ github.head_ref }}" != "staging" ]]; then
            echo "Pull requests targeting main must come from staging."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Branch policy check passed."

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [website, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.website.result }}" != "success" || \
                "${{ needs.branch-policy.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            echo "  website:       ${{ needs.website.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
