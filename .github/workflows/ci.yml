name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum
            seshat-server/go.sum

      - name: Build
        run: go build ./seshat-backend/... ./seshat-server/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum
            seshat-server/go.sum

      - name: Tests
        run: go test -race ./seshat-backend/... ./seshat-server/... -timeout 300s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            seshat-backend/go.sum
            seshat-server/go.sum

      - name: Check formatting
        run: |
          UNFORMATTED=$(find . -name "*.go" | xargs gofmt -l)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./seshat-backend/... ./seshat-server/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m ./seshat-backend/... ./seshat-server/...

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: seshat-ui
        run: npm ci

      - name: Typecheck
        working-directory: seshat-ui
        run: npm run typecheck

      - name: Lint
        working-directory: seshat-ui
        run: npm run lint

      - name: Build
        working-directory: seshat-ui
        run: npm run build

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR branch flow
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "main" && \
                "${{ github.head_ref }}" != "dev" ]]; then
            echo "Pull requests targeting main must come from dev."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "dev" ]]; then
            case "${{ github.head_ref }}" in
              feat/*|feature/*|fix/*|bugfix/*|docs/*|refactor/*|test/*|chore/*|perf/*|ci/*)
                ;;
              *)
                echo "Pull requests targeting dev must come from a typed topic branch."
                echo "Allowed prefixes: feat/, feature/, fix/, bugfix/, docs/, refactor/, test/, chore/, perf/, ci/"
                echo "Current head branch: ${{ github.head_ref }}"
                exit 1
                ;;
            esac
          fi

          echo "Branch policy check passed."

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [build, test, lint, desktop, website, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.build.result }}"         != "success" || \
                "${{ needs.test.result }}"           != "success" || \
                "${{ needs.lint.result }}"           != "success" || \
                "${{ needs.desktop.result }}"        != "success" || \
                "${{ needs.website.result }}"        != "success" || \
                "${{ needs.branch-policy.result }}"  != "success" ]]; then
            echo "One or more required checks failed."
            echo "  build:         ${{ needs.build.result }}"
            echo "  test:          ${{ needs.test.result }}"
            echo "  lint:          ${{ needs.lint.result }}"
            echo "  desktop:       ${{ needs.desktop.result }}"
            echo "  website:       ${{ needs.website.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
