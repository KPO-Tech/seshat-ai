name: seshat-server-stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seshat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-seshat_server}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seshat} -d ${POSTGRES_DB:-seshat_server}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Converts PDF/DOCX/PPTX/XLSX/audio/images to markdown before a corpus
  # file is chunked+embedded. Optional: plain-text/markdown/JSON files
  # ingest fine without it, and seshat-server falls back gracefully if this
  # service is unreachable. CPU-only image — no GPU passthrough configured.
  # This is a heavy image (PyTorch + layout/OCR models, several GB).
  #
  # The desktop app (seshat-backend) does NOT use this by default — it runs
  # its own local docling-serve via a managed Python venv
  # (~/.config/seshat/.venv, see cmd/api/main.go / `make install-python`),
  # and native DOCX/PPTX/XLSX/PDF-text-layer extraction now covers most of
  # what docling used to be needed for anyway (see internal/officetext,
  # internal/pdftext in the seshat SDK). This service is for
  # seshat-server's own knowledge-base ingestion path (set
  # SESHAT_SERVER_DOCLING_URL below), and/or for pointing the desktop app
  # at it instead of its own venv install if you'd rather share one
  # instance — set DOCLING_URL=http://localhost:${DOCLING_PORT:-5001} in
  # seshat-backend/.env to do that (it won't happen automatically).
  #
  # Published on the host (${DOCLING_PORT:-5001}) unlike before: without a
  # `ports:` mapping this was only reachable by other containers on this
  # compose's internal network (http://docling:5001), never by anything
  # running natively on the host — including seshat-backend.exe, which is
  # not itself a container. A container's internal port and a published
  # host port are two different things; only the latter is reachable via
  # localhost from outside Docker.
  docling:
    profiles: ["docs", "full"]
    image: quay.io/docling-project/docling-serve-cpu:${DOCLING_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      docling-redis:
        condition: service_started
    # The heaviest service by far (PyTorch + layout/OCR models) and the one
    # most likely to run away with host RAM on a large/scanned PDF — without
    # a cap, an oversized document can starve the whole host (Docker
    # Desktop/WSL2 has no default ceiling of its own on Windows), which is
    # what's behind unrelated apps crashing system-wide during a big
    # ingestion batch. Capped here so the worst case is this one container
    # getting OOM-killed and that ingestion job failing/retrying, not the
    # host. On a 16 GB machine this still leaves headroom for the rest of
    # the stack plus the host OS and browser - raise it if you have more
    # RAM and hit legitimate OOM kills on large documents.
    mem_limit: 3g
    environment: &docling-environment
      DOCLING_SERVE_ENG_KIND: rq
      DOCLING_SERVE_ENG_RQ_REDIS_URL: redis://docling-redis:6379/0
      DOCLING_SERVE_ENG_RQ_REDIS_MAX_CONNECTIONS: ${DOCLING_SERVE_ENG_RQ_REDIS_MAX_CONNECTIONS:-50}
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
      # An empty-string default here (as these two used to have) crashes
      # docling-serve outright: its Pydantic settings model requires a real
      # int, and an unset-but-present env var still passes "" through
      # Compose's map-form `environment:` (there's no way to conditionally
      # omit a key here) - it doesn't fall back to docling-serve's own
      # default the way leaving the var out of `environment:` entirely
      # would. These match docling-serve's own upstream defaults, so an
      # unset DOCLING_PERF_* in .env behaves the same as never setting it.
      DOCLING_PERF_PAGE_BATCH_SIZE: ${DOCLING_PERF_PAGE_BATCH_SIZE:-4}
      DOCLING_PERF_ELEMENTS_BATCH_SIZE: ${DOCLING_PERF_ELEMENTS_BATCH_SIZE:-16}
      # docling-serve's own internal wait budget for a synchronous convert
      # call - defaults to 120s, which a large/scanned/OCR-heavy PDF on a
      # CPU-only worker can easily exceed (seen taking 6+ minutes on a
      # 10 MB scanned document, and 13-14 minutes on a 60-page OCR-heavy
      # scanned book barely over 1 MB - page count and OCR density matter
      # far more than file size here). seshat-server's own docling client
      # (doclingIngestTimeout in internal/server/app/app.go) deliberately
      # budgets several minutes ABOVE this value, not equal to it: when
      # both were set to the same 900s, a document landing within seconds
      # of that ceiling turned into a race between the two timeouts, and
      # docling-serve losing it produces a "Task result not found" 404
      # that looks like a real failure even though the conversion was
      # about to finish.
      DOCLING_SERVE_MAX_SYNC_WAIT: ${DOCLING_SERVE_MAX_SYNC_WAIT:-1800}
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: ${DOCLING_SERVE_LOAD_MODELS_AT_BOOT:-false}
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: ${DOCLING_SERVE_OPTIONS_CACHE_SIZE:-32}
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    healthcheck:
      # Uses python3 rather than curl/wget — this image is Python-based
      # (docling-serve itself), so the interpreter is guaranteed present
      # even if a CLI HTTP client isn't.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  docling-worker:
    profiles: ["docs", "full"]
    image: quay.io/docling-project/docling-serve-cpu:${DOCLING_VERSION:-latest}
    restart: unless-stopped
    command: ["docling-serve", "rq-worker"]
    depends_on:
      docling-redis:
        condition: service_started
    mem_limit: ${DOCLING_WORKER_MEM_LIMIT:-3g}
    environment: *docling-environment

  docling-redis:
    profiles: ["docs", "full"]
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - docling-redis-data:/data

  # Local embedding model via Hugging Face's Text Embeddings Inference
  # (TEI) - a free, no-API-key alternative to OpenAI/Mistral/Gemini for
  # testing, and the natural pairing for tei-rerank below (same runtime,
  # same image, one model per instance - TEI can't serve both an embedding
  # and a reranker model from one process). CPU-only.
  #
  # NOT BAAI/bge-m3: verified (2026-09-12) that it crash-loops on TEI's
  # ONNX CPU backend here - it downloads and reaches "Warming up model"
  # fine, then the process exits cleanly (exit 0, not OOM) a few seconds
  # later, every restart, forever. Most likely bge-m3's hybrid
  # dense+sparse+ColBERT output heads aren't fully supported by TEI's ONNX
  # warmup path. intfloat/multilingual-e5-small is a plain single-output
  # multilingual encoder (100+ languages) that has been confirmed stable
  # on the same image/backend - needs ~2 GB resident once warmed up (not
  # lower just because "small" is in the name - ONNX Runtime's own arena
  # allocation dominates over model size here), so give it real headroom
  # rather than trusting the model's file size.
  #
  # Point Settings > Knowledge > Embedding at this once it's up: provider
  # "Custom endpoint", base URL http://localhost:${TEI_EMBED_PORT:-8082}/v1
  # (TEI exposes an OpenAI-compatible /v1/embeddings route), model
  # ${TEI_EMBED_MODEL:-intfloat/multilingual-e5-small} - or use the base
  # URL's own /info endpoint via the embedder card's "Detect" button once
  # that model id is unknown/forgotten.
  tei-embed:
    profiles: ["docs", "full"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-${TEI_VERSION:-latest}
    restart: unless-stopped
    command: ["--model-id", "${TEI_EMBED_MODEL:-intfloat/multilingual-e5-small}"]
    mem_limit: ${TEI_EMBED_MEM_LIMIT:-4g}
    ports:
      - "${TEI_EMBED_PORT:-8082}:80"
    volumes:
      - tei-embed-data:/data
    # No curl/wget in this image (Debian-slim with only what TEI itself
    # needs) - bash is present, so /dev/tcp is what's actually available
    # for a real HTTP check. start_period is long because the *first* boot
    # downloads the model from the Hub; cached in the tei-embed-data volume
    # after that, so later restarts are fast and don't need anywhere near
    # this long.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80; printf \"GET /health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s

  # Local reranker via the same TEI runtime, loaded with a cross-encoder
  # (sequence-classification) model instead of an embedding one -
  # BAAI/bge-reranker-v2-m3 is the small (~570M params), well-regarded
  # default. Point Settings > Knowledge > Reranker at "TEI / vLLM local"
  # once it's up: endpoint URL
  # http://localhost:${TEI_RERANK_PORT:-8083}/rerank, model
  # ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}.
  #
  # For seshat-server's own (env-var-only, not per-org-settable today -
  # see internal/server/app/app.go) reranker, set RAG_RERANK_URL below to
  # http://tei-rerank/rerank to actually use this for real search, not
  # just Settings' local test/detect probes.
  tei-rerank:
    profiles: ["docs", "full"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-${TEI_VERSION:-latest}
    restart: unless-stopped
    command: ["--model-id", "${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}"]
    # bge-reranker-v2-m3 ships no ONNX weights on the Hub, so TEI's CPU
    # image falls back to loading the full fp32 safetensors (~2.3 GB) - a
    # 2g limit OOM-kills it (exit 137) partway through that fallback.
    mem_limit: ${TEI_RERANK_MEM_LIMIT:-4g}
    ports:
      - "${TEI_RERANK_PORT:-8083}:80"
    volumes:
      - tei-rerank-data:/data
    # See tei-embed's healthcheck comment above for why this is bash
    # /dev/tcp instead of curl, and why start_period is this long.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80; printf \"GET /health HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n\" >&3; head -n1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s

  # OpenSearch is the target vector/search engine for enterprise Knowledge
  # validation. It is profile-gated because it is heavier than the core
  # control-plane stack and is not wired into seshat-server by default yet.
  #
  # Security is disabled here intentionally for local development and engine
  # integration testing only. Do not expose this service beyond localhost or
  # reuse this exact configuration in production.
  opensearch:
    profiles: ["knowledge", "full"]
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      cluster.name: seshat-knowledge
      node.name: seshat-opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERF_PORT:-9600}:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Optional S3-compatible object storage for knowledge-base corpus files,
  # as an alternative to the default local-disk storage. Not wired up by
  # default (SESHAT_SERVER_STORAGE_PROVIDER stays empty/local below) so an
  # existing deployment using local disk is never silently switched over —
  # opting in means setting SESHAT_SERVER_STORAGE_PROVIDER=s3 in .env.
  # Comment this service and minio-createbucket out if you don't want it
  # running at all (e.g. no S3 storage testing planned).
  minio:
    profiles: ["s3", "full"]
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seshat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket seshat-server writes corpus files into.
  # Idempotent (mc mb --ignore-existing) so re-running compose is harmless.
  minio-createbucket:
    profiles: ["s3", "full"]
    image: minio/mc:latest
    mem_limit: 128m
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seshat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/${SESHAT_SERVER_S3_BUCKET:-seshat-corpora}
      "

  # Fake SMTP server + web UI for local/test email flows (verification
  # codes, invitations, password resets) — every message sent to it is
  # caught and viewable at http://localhost:8025 instead of actually being
  # delivered, so no real mailbox or SMTP credentials are needed yet. Swap
  # SESHAT_SERVER_SMTP_* in .env to point at a real provider once one of
  # these flows is ready to send real email.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

  seshat-server:
    build:
      context: ..
      dockerfile: seshat-server/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SESHAT_SERVER_PORT: "8081"
      SESHAT_SERVER_DB_DRIVER: postgres
      SESHAT_SERVER_DB_DSN: >-
        host=postgres user=${POSTGRES_USER:-seshat} password=${POSTGRES_PASSWORD}
        dbname=${POSTGRES_DB:-seshat_server} port=5432 sslmode=disable
      # Generate with: openssl rand -base64 32. Only required once a
      # provider-setting (LLM credential) is actually created — the server
      # still starts fine without it.
      SESHAT_SERVER_ENCRYPTION_KEY: ${SESHAT_SERVER_ENCRYPTION_KEY:-}
      # Unset by default: the console reaches this service through its own
      # nginx reverse proxy (same-origin), not a cross-origin browser call —
      # only needed if something else calls the API directly from a browser.
      SESHAT_SERVER_CORS_ALLOWED_ORIGINS: ${SESHAT_SERVER_CORS_ALLOWED_ORIGINS:-}
      # Empty by default so the core stack starts quickly. Use
      # `make deploy-up-docs` / `make deploy-up-full`, or set this explicitly
      # in deploy/.env, to point at the optional docling service.
      SESHAT_SERVER_DOCLING_URL: ${DEPLOY_DOCLING_URL:-}
      SESHAT_SERVER_KNOWLEDGE_CHUNK_PROFILE: ${SESHAT_SERVER_KNOWLEDGE_CHUNK_PROFILE:-medium}
      SESHAT_SERVER_KNOWLEDGE_CHUNK_MAX_TOKENS: ${SESHAT_SERVER_KNOWLEDGE_CHUNK_MAX_TOKENS:-}
      SESHAT_SERVER_KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${SESHAT_SERVER_KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-}
      # Knowledge vector store. Empty/unset defaults to embedded HNSW in
      # seshat-server today. SESHAT_SERVER_VECTOR_STORE is the primary name;
      # SESHAT_SERVER_VECTOR_BACKEND remains a legacy alias in config.go.
      SESHAT_SERVER_VECTOR_STORE: ${SESHAT_SERVER_VECTOR_STORE:-}
      SESHAT_SERVER_VECTOR_DIM: ${SESHAT_SERVER_VECTOR_DIM:-}
      SESHAT_SERVER_VECTOR_HNSW_DIR: ${SESHAT_SERVER_VECTOR_HNSW_DIR:-}
      SESHAT_SERVER_OPENSEARCH_ADDRESSES: ${SESHAT_SERVER_OPENSEARCH_ADDRESSES:-http://opensearch:9200}
      SESHAT_SERVER_OPENSEARCH_USERNAME: ${SESHAT_SERVER_OPENSEARCH_USERNAME:-}
      SESHAT_SERVER_OPENSEARCH_PASSWORD: ${SESHAT_SERVER_OPENSEARCH_PASSWORD:-}
      SESHAT_SERVER_OPENSEARCH_API_KEY: ${SESHAT_SERVER_OPENSEARCH_API_KEY:-}
      SESHAT_SERVER_OPENSEARCH_INDEX_PREFIX: ${SESHAT_SERVER_OPENSEARCH_INDEX_PREFIX:-seshat-knowledge}
      SESHAT_SERVER_OPENSEARCH_CREATE_INDEX: ${SESHAT_SERVER_OPENSEARCH_CREATE_INDEX:-true}
      SESHAT_SERVER_OPENSEARCH_KNN: ${SESHAT_SERVER_OPENSEARCH_KNN:-false}
      SESHAT_SERVER_OPENSEARCH_INSECURE_SKIP_VERIFY: ${SESHAT_SERVER_OPENSEARCH_INSECURE_SKIP_VERIFY:-false}
      SESHAT_SERVER_OPENSEARCH_BULK_SIZE: ${SESHAT_SERVER_OPENSEARCH_BULK_SIZE:-}
      # Reranker: read directly by github.com/KPO-Tech/seshat/internal/rag/
      # reranker.NewFromEnv() (RAG_RERANK_* is a plain SDK-level convention,
      # not a SESHAT_SERVER_-prefixed setting) - there is no per-org DB
      # setting for this yet, unlike the embedder above. Empty by default,
      # same reasoning as SESHAT_SERVER_DOCLING_URL - set RAG_RERANK_URL in
      # .env (e.g. http://tei-rerank/rerank, once the "docs"/"full" profile
      # is running tei-rerank below) to actually enable it.
      RAG_RERANK_URL: ${RAG_RERANK_URL:-}
      RAG_RERANK_API_KEY: ${RAG_RERANK_API_KEY:-}
      RAG_RERANK_MODEL: ${RAG_RERANK_MODEL:-}
      # Corpus file storage. Empty/unset SESHAT_SERVER_STORAGE_PROVIDER
      # defaults to local disk (today's behavior, unchanged) — set it to
      # "s3" in .env to point at the minio service above instead.
      SESHAT_SERVER_STORAGE_PROVIDER: ${SESHAT_SERVER_STORAGE_PROVIDER:-}
      SESHAT_SERVER_S3_ENDPOINT: ${SESHAT_SERVER_S3_ENDPOINT:-}
      SESHAT_SERVER_S3_BUCKET: ${SESHAT_SERVER_S3_BUCKET:-}
      SESHAT_SERVER_S3_ACCESS_KEY_ID: ${SESHAT_SERVER_S3_ACCESS_KEY_ID:-}
      SESHAT_SERVER_S3_SECRET_ACCESS_KEY: ${SESHAT_SERVER_S3_SECRET_ACCESS_KEY:-}
      SESHAT_SERVER_S3_REGION: ${SESHAT_SERVER_S3_REGION:-}
      SESHAT_SERVER_S3_KEY_PREFIX: ${SESHAT_SERVER_S3_KEY_PREFIX:-}
      # Seeds a platform super-admin at boot if no user exists yet at this
      # email — see config.go's doc comment. Leave both empty to skip.
      SESHAT_SERVER_BOOTSTRAP_ADMIN_EMAIL: ${SESHAT_SERVER_BOOTSTRAP_ADMIN_EMAIL:-}
      SESHAT_SERVER_BOOTSTRAP_ADMIN_PASSWORD: ${SESHAT_SERVER_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Points at the mailpit service above by default - every email sent
      # (invitation accept links, password reset links) lands there instead
      # of a real inbox, viewable at http://localhost:8025. Swap these to a
      # real provider's SMTP relay once one of those flows is ready to send
      # real email; empty SESHAT_SERVER_SMTP_HOST disables sending entirely
      # (both flows still work without it, just without email delivery).
      SESHAT_SERVER_SMTP_HOST: ${SESHAT_SERVER_SMTP_HOST:-mailpit}
      SESHAT_SERVER_SMTP_PORT: ${SESHAT_SERVER_SMTP_PORT:-1025}
      SESHAT_SERVER_SMTP_USERNAME: ${SESHAT_SERVER_SMTP_USERNAME:-}
      SESHAT_SERVER_SMTP_PASSWORD: ${SESHAT_SERVER_SMTP_PASSWORD:-}
      SESHAT_SERVER_SMTP_FROM: ${SESHAT_SERVER_SMTP_FROM:-Seshat <noreply@seshat.local>}
      # This deployment's own console URL, used to build the links embedded
      # in emails (e.g. https://app.example.com/accept-invitation?token=...).
      # Defaults assume the default SESHAT_CONSOLE_PORT=3000 - set this
      # explicitly in .env if you changed that port.
      SESHAT_SERVER_PUBLIC_APP_URL: ${SESHAT_SERVER_PUBLIC_APP_URL:-http://localhost:3000}
    # Corpus files land under /app/.seshat when SESHAT_SERVER_STORAGE_PROVIDER
    # is empty/local (the default — see storageConfigFromEnv), which without
    # this volume lives only in the container's writable layer: gone on the
    # next `docker compose up --build`/`down`/image rebuild, silently, with
    # no error. Switching to `s3` (the minio service) is the other way to
    # get real persistence; this volume is what makes the *default* local
    # mode persistent instead of a trap.
    volumes:
      - seshat-server-artifacts:/app/.seshat
    # Lets this container reach services running directly on the host (e.g.
    # a local Ollama for LLM/embedder settings) via http://host.docker.internal:<port>
    # instead of localhost, which inside a container means the container
    # itself, not the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SESHAT_SERVER_PORT:-8081}:8081"

  seshat-console:
    build:
      context: ..
      dockerfile: seshat-console/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - seshat-server
    ports:
      - "${SESHAT_CONSOLE_PORT:-3000}:80"

  # Self-hosted meta-search instance for testing the SearXNG web-search
  # provider end-to-end from the control-plane stack.
  searxng-redis:
    profiles: ["search", "full"]
    image: valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - searxng-redis-data:/data

  # One-shot: replaces the placeholder secret_key checked into
  # searxng/settings.yml with a random one before searxng ever reads the
  # file. Idempotent (the grep guards the sed) so re-running compose is
  # harmless once the key's been rotated the first time.
  searxng-secret-key:
    profiles: ["search", "full"]
    image: alpine:3.20
    mem_limit: 64m
    volumes:
      - ./searxng:/etc/searxng:rw
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if grep -q "change-this-local-searxng-key" /etc/searxng/settings.yml; then
          key=$$(tr -dc 'a-f0-9' < /dev/urandom | head -c64)
          sed -i "s/change-this-local-searxng-key/$$key/" /etc/searxng/settings.yml
          echo "[searxng-secret-key] generated a random secret_key"
        else
          echo "[searxng-secret-key] secret_key already set, skipping"
        fi

  # No HTTP auth in front of this by default - fine for local-only use
  # (only reachable at localhost:${SEARXNG_PORT}), but SearXNG has no
  # built-in auth of its own; if this stack is ever exposed beyond
  # localhost, put a reverse proxy (nginx/Caddy) with HTTP basic auth in
  # front of it first (SearXNG's own docs recommend this for any public
  # instance, to avoid it being abused as an open anonymous search proxy).
  # The seshat-server web-search provider settings already support an
  # auth_username/auth_password pair for exactly this case - see
  # WebSearchSettingsPage.tsx's SearXNG config drawer.
  searxng:
    profiles: ["search", "full"]
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      searxng-redis:
        condition: service_started
      searxng-secret-key:
        condition: service_completed_successfully
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:${SEARXNG_PORT:-8080}/}
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng

  # TLS termination in front of seshat-console (which already reverse-
  # proxies /api/* to seshat-server - see seshat-console/nginx.conf). Off by
  # default (profile-gated) - local development talks to seshat-console
  # directly over plain HTTP on SESHAT_CONSOLE_PORT, which is fine for
  # that. This is the "real reverse proxy" deploy/README.md's Production
  # Notes has always pointed at without providing, turned into something
  # actually runnable: `make deploy-up-tls`.
  #
  # Caddy's automatic HTTPS needs no certificate config at all here - see
  # Caddyfile's own comment for how it picks a real ACME certificate for a
  # public domain vs. a locally-trusted one for "localhost"/an IP, from the
  # SESHAT_PUBLIC_DOMAIN value alone.
  reverse-proxy:
    profiles: ["tls", "full"]
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - seshat-console
    environment:
      SESHAT_PUBLIC_DOMAIN: ${SESHAT_PUBLIC_DOMAIN:-localhost}
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  seshat-server-artifacts:
  docling-redis-data:
  tei-embed-data:
  tei-rerank-data:
  opensearch-data:
  minio-data:
  searxng-redis-data:
  searxng-data:
  caddy-data:
  caddy-config:
