        "200":
          description: Updated web-search provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Delete a web-search provider setting
      description: Local resolution falls back to the platform default (or fails) at next use; nothing else is touched.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/web-search-org-policy:
    get:
      operationId: getWebSearchOrgPolicy
      tags: [web-search-org-policy]
      summary: Get an organization's web-search domain policy
      description: >-
        Open to any org member (a domain policy isn't secret, and every
        member needs to read it to have it applied locally). Returns an
        empty policy (both lists empty), not 404, when the organization has
        never set one.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Web-search domain policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchOrgPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: upsertWebSearchOrgPolicy
      tags: [web-search-org-policy]
      summary: Replace an organization's web-search domain policy
      description: >-
        Requires web_search_settings.manage or organization.manage. Full
        replace, not a merge — send the complete allowed/blocked lists each
        time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchOrgPolicyInput" }
      responses:
        "200":
          description: Updated web-search domain policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchOrgPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp-server-configs:
