openapi: 3.0.3
info:
  title: Seshat Server API
  description: >
    Cloud control plane for Seshat: auth, organizations, memberships, roles,
    permissions, groups, policy bindings, invitations, sessions, applications,
    providers and audit trail. Devices, scheduled jobs and runs are planned
    but not implemented yet.
  version: "1.0.0"
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and bootstrap-status checks, no authentication required.
  - name: auth
    description: Bootstrap, login, logout and session-principal resolution.
  - name: organizations
    description: Tenant boundary that every other domain is scoped to.
  - name: users
    description: Platform-level user accounts (distinct from per-org memberships).
  - name: roles-and-permissions
    description: Static role and permission catalogs.
  - name: memberships
    description: Binds a user to an organization under a role.
  - name: invitations
    description: Pending or resolved organization access invites.
  - name: groups
    description: Organization-local user collections used as policy-binding subjects.
  - name: policy-bindings
    description: Grants a set of permissions to a user, group or role.
  - name: sessions
    description: Active bearer-token logins.
  - name: audit
    description: Read-only audit trail of control-plane mutations.
  - name: preferences
    description: >-
      A user's own personal settings — no organization, no hierarchy, self-service
      only (same trust level as GET/PUT /auth/me).
  - name: memories
    description: >-
      A user's own flat personal memory list (facts, preferences, instructions
      noted for later) — no organization, self-service only, same trust level
      as preferences. Distinct from the long-term memory graph (see the
      memory-graph tag) — this is a simple key/value-ish list, not entities/
      relations.
  - name: memory-graph
    description: >-
      A user's own long-term memory knowledge graph (entities/observations/
      relations) — self-service only, no organization. Search is a
      case-insensitive substring match over everything the user has, the
      same algorithm as seshat-backend's local implementation — this is
      deliberately not a vector/embedding relevance system.
  - name: skill-repos
    description: >-
      An organization's curated list of recommended skill repo URLs. Authorship
      and execution of skills stay local to seshat-backend — this is purely a
      bookmarked-URL catalog it fetches to enrich its own local skill-repo list.
  - name: agent-presets
    description: >-
      An organization's shared catalog of agent presets (system prompt, model,
      permission mode, tools). Purely additive: seshat-backend's own local,
      unscoped agent_definitions table is untouched — this is one more source
      resolved at query time alongside it and the SDK's built-in registry,
      never a replacement.
  - name: quota-usage
    description: >-
      A user's own personal usage counters (queries/files/ingestions, per day
      and per month) — no organization, self-service only, same trust level as
      preferences. Pure counting, never an enforced limit: there is no
      plan/tier concept anywhere yet.
  - name: applications
    description: OAuth/OIDC client applications registered with the control plane.
  - name: providers
    description: Upstream identity providers (OIDC/OAuth2/SAML).
  - name: scim-connections
    description: >-
      Per-organization SCIM 2.0 provisioning connection (RFC 7643/7644) — an
      enterprise IdP (Okta, Entra ID, ...) pushes user/group changes here
      instead of an admin managing membership by hand. One connection per
      organization. These are admin-facing management endpoints for the
      connection itself (name, enabled flag, sync options, bearer token
      rotation); the SCIM protocol endpoints the IdP actually calls
      (/scim/v2/Users, /scim/v2/Groups, ...) are a separate, not-yet-built
      surface (see docs/helps in the seshat-ai repo for the staged plan).
  - name: provider-settings
    description: >-
      Per-organization LLM provider credentials (Anthropic, OpenAI, ...) —
      distinct from providers (OAuth/OIDC identity), these are what unblocks
      execution_target=cloud jobs.
  - name: web-search-provider-settings
    description: >-
      Per-organization web-search provider credentials (Tavily, Exa, Jina,
      LangSearch, SearXNG) — a separate domain from provider-settings (LLM
      credentials): no default_model concept applies here, and SearXNG needs
      a second credential field (auth_username) no LLM provider has. Read
      (list/resolve) is open to any org member; write requires
      web_search_settings.manage.
  - name: web-search-org-policy
    description: >-
      An organization's allowed/blocked domain policy for web search,
      merged into every connected member's local search settings — blocked
      domains are always applied, allowed domains are additive.
  - name: mcp-server-configs
    description: >-
      An organization's shared MCP server definitions (stdio/http/sse).
      Read/resolve is open to any org member; write requires
      mcp_registry.manage. Mainly config a connected seshat-backend fetches
      and, once the user explicitly approves each server, loads locally
      (stdio servers spawn an arbitrary command on the user's machine) —
      but the workspace chat's own agent session also resolves and executes
      these servers directly server-side. A server whose connector_kind is
      set (gdrive/sharepoint/slack/outlook/teams/gmail) has a per-caller Authorization: Bearer header
      bridged in from that person's own connected account when resolved —
      see ResolvedMCPServerConfig.connected.
  - name: devices
    description: Registered seshat-backend (local desktop) instances that the cloud can target.
  - name: jobs
    description: Scheduled automation definitions (cron/interval/once, cloud- or device-targeted).
  - name: runs
    description: Individual executions of a job.
  - name: device-protocol
    description: >-
      Device-bearer-token-authenticated endpoints (a registered device's own
      token, not a user session) used by seshat-backend to claim and report
      on its assigned runs.
  - name: prospecting
    description: >-
      Organization-scoped business-discovery sweeps (Google Places grid
      search + French company-registry enrichment) — team data, not
      per-user like seshat-backend's local equivalent. Requires
      prospecting.read/prospecting.manage.

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: seshat-server }
                  mode: { type: string, example: iam-core }

  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      tags: [system]
      summary: Check whether the platform has been bootstrapped
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
                  org_mode: { type: string, enum: [single, multi], example: multi }
                  has_organization: { type: boolean }

  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapPlatform
      tags: [auth]
      summary: Create the first platform admin, organization and session
      description: >
        One-time only: fails with 409 once any user already exists. Not
        rate-limited (repeated calls after init just fail a cheap existence
        check).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name, organization_name, organization_slug]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_name: { type: string }
                organization_slug: { type: string }
      responses:
        "201":
          description: Platform bootstrapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange email/password for a bearer session token
      description: >
        Rate limited to 5 attempts/minute per client IP (burst 5); beyond
        that, returns 429 before even checking credentials. Every attempt
        (success or failure) is written to the audit trail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Self-service account creation
      description: >
        Unlike bootstrap (one-time, first account only) or admin-created
        users, anyone can call this. If the email's domain matches an
        organization's own `domain`, the new user is immediately auto-joined
        to that organization as a "pending" member - full access already,
        just flagged for admin attention (see Membership.status) until
        confirmed (`POST /memberships/{id}/confirm`) or auto-blocked after
        `SESHAT_SERVER_MEMBERSHIP_CONFIRMATION_WINDOW` (default ~2 months)
        unconfirmed. No domain match just creates the account with no
        memberships - use `POST /organizations` afterwards to found a new
        one. Rate limited to 3 attempts/minute per client IP (burst 5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Account created (and, if the email domain matched an organization, auto-joined pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link by email
      description: >
        Always returns 200 with the same generic message regardless of
        whether the email matches an account — a different response would
        let an attacker enumerate accounts by email. If a match exists, a
        1-hour-lived reset link is emailed (see /reset-password). Rate
        limited to 3 attempts/minute per client IP (burst 3) — the
        tightest limit of any endpoint, since this is both an
        email-enumeration and inbox-spam vector.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Request accepted (does not imply an email was actually sent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Redeem a password-reset token
      description: >
        No authentication required — the token itself is the credential.
        Deliberately generic on failure (401 regardless of whether the
        token is unknown, already used, or expired) to avoid leaking
        feedback useful for guessing tokens. On success, every existing
        session for the account is revoked. Rate limited to 5
        attempts/minute per client IP (burst 5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password }
      responses:
        "204": { description: Password reset, all sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: Resolve the current session's principal
      responses:
        "200":
          description: Current user, memberships, visible organizations and session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the session that authenticated this request
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations visible to the caller
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      organizations:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization (self-serve)
      description: >
        Any authenticated user may create an organization; the caller is
        attached as its owner automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationID}:
    parameters:
      - $ref: "#/components/parameters/organizationIDPath"
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get one organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization settings
      description: Requires `organization.manage` (owner or admin role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete an organization
      description: >
        Requires `organization.delete` — owner only, not admin. Cascades
        memberships, applications, providers, invitations, groups and policy
        bindings scoped to the organization. Audit history is kept.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/set-default:
    post:
      operationId: setOrganizationDefault
      tags: [organizations]
      summary: Flag this organization as the platform default (platform admin only)
      description: >
        Its own ProviderSetting/EmbedderSetting rows become the fallback
        used by every other organization with no config of its own. Clears
        the flag from whichever organization currently holds it.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/unset-default:
    post:
      operationId: unsetOrganizationDefault
      tags: [organizations]
      summary: Clear the platform-default flag from this organization (platform admin only)
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/activate:
    post:
      operationId: activateOrganization
      tags: [organizations]
      summary: Mark this organization active (platform admin only)
      description: Administrative/visual only for now - not enforced on any request path.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/deactivate:
    post:
      operationId: deactivateOrganization
      tags: [organizations]
      summary: Mark this organization inactive (platform admin only)
      description: Administrative/visual only for now - not enforced on any request path.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/shared-domains:
    put:
      operationId: setOrganizationSharedDomains
      tags: [organizations]
      summary: Choose which settings domains this organization shares while it's the platform default (platform admin only)
      description: >
        Only meaningful while this organization holds is_default. Lets a
        platform admin share, say, this organization's MCP servers with
        every other organization while keeping its LLM provider credentials
        private to itself, instead of is_default sharing everything
        unconditionally. Fields omitted from the body leave that domain's
        flag unchanged.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSharedDomainsInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/verify-domain:
    post:
      operationId: verifyOrganizationDomain
      tags: [organizations]
      summary: Verify ownership of this organization's claimed email domain
      description: >-
        Resolves a DNS TXT record at _seshat-challenge.<domain> (expected
        value "seshat-verification=<domain_verification_token>") and marks
        the domain verified on a match. Requires organization.manage.
        Closes a real gap: claiming a domain alone previously granted no
        proof of ownership, and self-service registration
        (POST /auth/register) trusted it anyway for auto-join — that
        auto-join now requires domain_verified_at to be set. 400 if the
        organization has no domain pending verification, or if the TXT
        record is missing/mismatched/not yet propagated.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Domain verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/docling-status:
    get:
      operationId: getDoclingStatus
      tags: [platform]
      summary: Whether this server has a docling-serve instance configured (platform admin only)
      description: >-
        docling-serve is a shared, server-wide setting (SESHAT_SERVER_DOCLING_URL),
        not something any organization configures for itself - there's no
        per-organization equivalent. The URL isn't a secret (shared
        infrastructure, not a credential).
      responses:
        "200":
          description: Docling status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (platform admin only)
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      users:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (platform admin only)
      description: >
        If `organization_id` is set, also creates a membership with `role`
        (default `member`) in the same call. Always creates a regular
        (non-platform-admin) account — there is no is_admin field here or
        anywhere else in this API. Platform-admin status is granted exactly
        once, by seeding from env vars at server boot, and never through
        any API action afterwards, by anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_id: { type: string }
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userIDPath"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: Platform admin, or the user viewing themself.
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (platform admin only)
      description: >-
        Email and display name only — no is_admin field, see createUser's
        description for why.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (platform admin only)
      description: >
        Cascades memberships and sessions. Cannot delete the last admin or
        the currently authenticated admin.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [users, sessions]
      summary: Revoke all sessions for one user
      description: Platform admin for any user, or a user targeting themself.
      parameters:
        - $ref: "#/components/parameters/userIDPath"
      responses:
        "200":
          description: Revocation count
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [roles-and-permissions]
      summary: List the role catalog
      description: >
        Without `organization_id`, only the 4 built-in system roles (owner,
        admin, member, viewer — `system: true`, not editable/deletable) are
        returned. With `organization_id`, the organization's custom roles
        (`system: false`) are appended. Not paginated — bounded by how many
        roles one organization defines, not event volume.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRole
      tags: [roles-and-permissions]
      summary: Create a custom role for an organization
      description: >
        Requires `roles.manage` or `organization.manage`. `code` must be
        lowercase letters/digits/hyphen/underscore and cannot reuse a
        reserved system role code (owner/admin/member/viewer).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/roles/{roleCode}:
    parameters:
      - name: roleCode
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRole
      tags: [roles-and-permissions]
      summary: Get a role
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateRole
      tags: [roles-and-permissions]
      summary: Update a custom role
      description: >
        Requires `roles.manage` or `organization.manage`. System roles
        return 409. Renaming `code` cascades to every membership,
        invitation and policy binding referencing the old code, in one
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteRole
      tags: [roles-and-permissions]
      summary: Delete a custom role
      description: >
        Requires `roles.manage` or `organization.manage`. System roles,
        roles still assigned to a membership, and roles with active
        invitations all return 409.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags: [roles-and-permissions]
      summary: List the permission catalog
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List memberships
      description: >
        Platform admin sees everyone's; an org manager sees their org's
        memberships; a regular user sees only their own.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: user_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      memberships:
                        type: array
                        items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMembership
      tags: [memberships]
      summary: Add an existing user to an organization
      description: Requires `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, user_id, role]
              properties:
                organization_id: { type: string }
                user_id: { type: string }
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/memberships/direct:
    post:
      operationId: createOrganizationMember
      tags: [memberships]
      summary: Create a new account and attach it to an organization in one step
      description: >-
        Sibling action to POST /memberships (which only attaches an
        EXISTING user) — this creates the account too. Requires
        members.manage or organization.manage (org-admin, unlike POST
        /users which is platform-superadmin-only). No password field: one
        is generated internally and never exposed — the new member sets
        their own via an emailed welcome link that reuses the same
        /reset-password flow as a forgotten-password reset. Optionally
        attaches the new member to one or more existing groups in the same
        step via group_ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, email, display_name]
              properties:
                organization_id: { type: string }
                email: { type: string, format: email }
                display_name: { type: string }
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization. Defaults to "member".
                group_ids:
                  type: array
                  items: { type: string }
                  description: Existing groups (in the same organization) to attach the new member to immediately.
      responses:
        "201":
          description: Account created and attached as a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/memberships/{membershipID}:
    parameters:
      - name: membershipID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMembership
      tags: [memberships]
      summary: Get a membership
      description: Org manager, platform admin, or the member themself.
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateMembership
      tags: [memberships]
      summary: Change a membership's role
      description: >
        Requires `members.manage` or `organization.manage`. Cannot demote the
        last owner of an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteMembership
      tags: [memberships]
      summary: Remove a membership
      description: >
        An org manager may remove any member; any user may remove their own
        membership to leave the organization. Cannot remove the last owner.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/memberships/{membershipID}/confirm:
    post:
      operationId: confirmMembership
      tags: [memberships]
      summary: Finalize a self-registered pending membership
      description: >
        Requires `members.manage` or `organization.manage`. Sets status to
        "active" and clears pending_since. A no-op (not an error) on a
        membership that isn't pending.
      parameters:
        - name: membershipID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Confirmed membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List invitations
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      invitations:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite an email to join an organization
      description: >
        Requires `invitations.manage`, `members.manage` or
        `organization.manage`. Rejects a duplicate pending invite or an email
        already belonging to a member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, email, role]
              properties:
                organization_id: { type: string }
                email: { type: string, format: email }
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
                expires_in_days: { type: integer, default: 7 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/lookup:
    get:
      operationId: lookupInvitation
      tags: [invitations]
      summary: Preview an invitation by its raw token, unauthenticated
      description: >-
        No auth required — the invited person usually doesn't have an
        account yet, so gating the preview behind login would be
        backwards. Returns valid:false (still HTTP 200, not an error) for
        an unknown, expired, or already-used token, so the console can
        render "this invitation is no longer valid" instead of a raw
        error. Never includes the invitation id, inviter, or raw token.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/invitations/{invitationID}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get an invitation
      description: Org manager, platform admin, or the invited email's owner.
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/{invitationID}/revoke:
    post:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Redeem a pending invitation for the authenticated user
      description: >
        The invitation's email must match the authenticated user's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: New membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      groups:
                        type: array
                        items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: Requires `groups.manage`, `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group
      description: Requires `groups.read`, `groups.manage`, `members.manage` or `organization.manage`.
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        group cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdateInput" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      description: Also removes any policy bindings that target this group.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-bindings:
    get:
      operationId: listPolicyBindings
      tags: [policy-bindings]
      summary: List policy bindings
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Policy binding list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      policy_bindings:
                        type: array
                        items: { $ref: "#/components/schemas/PolicyBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createPolicyBinding
      tags: [policy-bindings]
      summary: Grant permissions to a user, group or role
      description: Requires `policies.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyBindingInput" }
      responses:
        "201":
          description: Policy binding created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-bindings/{bindingID}:
    parameters:
      - name: bindingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPolicyBinding
      tags: [policy-bindings]
      summary: Get a policy binding
      description: Requires `policies.read`, `policies.manage` or `organization.manage`.
      responses:
        "200":
          description: Policy binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePolicyBinding
      tags: [policy-bindings]
      summary: Update a policy binding
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        policy binding cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyBindingUpdateInput" }
      responses:
        "200":
          description: Updated policy binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePolicyBinding
      tags: [policy-bindings]
      summary: Delete a policy binding
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desktop-policies/catalog:
    get:
      operationId: listDesktopPolicyCatalog
      tags: [desktop-policies]
      summary: List the fixed desktop policy catalog
      description: >
        Any authenticated member can read this — it's a fixed, code-defined
        catalog (not organization-specific data), not the per-organization
        assignment of it.
      responses:
        "200":
          description: Desktop policy catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  desktop_policies:
                    type: array
                    items: { $ref: "#/components/schemas/DesktopPolicy" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/desktop-policy-bindings:
    get:
      operationId: listDesktopPolicyBindings
      tags: [desktop-policies]
      summary: List desktop policy bindings for an organization
      description: Requires `desktop_policies.read`, `desktop_policies.manage` or `organization.manage`.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Desktop policy binding list
          content:
            application/json:
              schema:
                type: object
                properties:
                  desktop_policy_bindings:
                    type: array
                    items: { $ref: "#/components/schemas/DesktopPolicyBinding" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: setDesktopPolicyBinding
      tags: [desktop-policies]
      summary: Create or update a desktop policy binding
      description: >
        Upsert by (organization_id, policy_code, subject_type, subject_id) —
        posting again for the same subject updates its value in place rather
        than creating a duplicate. Requires `desktop_policies.manage` or
        `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DesktopPolicyBindingInput" }
      responses:
        "200":
          description: Desktop policy binding created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesktopPolicyBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/desktop-policy-bindings/{bindingID}:
    parameters:
      - name: bindingID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteDesktopPolicyBinding
      tags: [desktop-policies]
      summary: Delete a desktop policy binding
      description: >
        The affected subject falls back to the next-most-specific applicable
        binding, or the catalog default if none remain.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions
      description: >
        Platform admin sees everyone's sessions; a regular user always sees
        only their own, regardless of the `user_id` filter passed.
      parameters:
        - name: user_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      sessions:
                        type: array
                        items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      tags: [sessions]
      summary: Revoke one session
      description: >
        Platform admin may revoke any session; a regular user may only
        revoke one of their own.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events
      description: Requires `audit.read`, `organization.manage` or `members.manage` for the relevant organization.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: actor_user_id
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      audit_events:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users/me/password:
    put:
      operationId: changeMyPassword
      tags: [users]
      summary: Change my own password
      description: >-
        Self-service only — requires re-proving the current password, so a
        stolen bearer token alone can't rotate credentials. Does not revoke
        the current session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204":
          description: Password updated
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [preferences]
      summary: Get my own preferences
      description: >-
        Self-service only — there is no {userID} variant, a preference only
        ever means "mine." Returns a zero-value record (not 404) if none has
        been saved yet.
      responses:
        "200":
          description: My preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateMyPreferences
      tags: [preferences]
      summary: Create or replace my own preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memories:
    get:
      operationId: listMyMemories
      tags: [memories]
      summary: List my own memories
      description: Self-service only. Ordered by importance then recency, most important/most recent first.
      responses:
        "200":
          description: My memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items: { $ref: "#/components/schemas/UserMemory" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMyMemory
      tags: [memories]
      summary: Create a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserMemoryInput" }
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMemory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteAllMyMemories
      tags: [memories]
      summary: Delete every one of my own memories
      responses:
        "200":
          description: Number deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memories/{memoryID}:
    parameters:
      - name: memoryID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMyMemory
      tags: [memories]
      summary: Update one of my own memories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserMemoryUpdateInput" }
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMemory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMyMemory
      tags: [memories]
      summary: Delete one of my own memories
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/me/memory-graph/entities:
    post:
      operationId: upsertMyMemoryEntities
      tags: [memory-graph]
      summary: Create entities that don't exist yet (deduplicated by name)
      description: >-
        An entity whose name already exists is left untouched (skipped, not
        updated) — matches the underlying reference implementation. Returns
        only the entities that were actually inserted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  type: array
                  items: { $ref: "#/components/schemas/MemoryEntityInput" }
      responses:
        "200":
          description: Entities actually created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryEntity" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/observations:
    post:
      operationId: addMyMemoryObservations
      tags: [memory-graph]
      summary: Append observations to existing entities
      description: Duplicate observation strings (already present on that entity) are silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observations:
                  type: array
                  items: { $ref: "#/components/schemas/MemoryObservationInput" }
      responses:
        "200":
          description: What was actually added, per entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryObservationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/me/memory-graph/search:
    get:
      operationId: searchMyMemoryNodes
      tags: [memory-graph]
      summary: Search my own memory graph
      description: >-
        Case-insensitive substring match across entity names, entity types,
        and observation content — not a vector/relevance search. An empty
        query returns everything.
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching entities plus relations touching them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/open:
    post:
      operationId: openMyMemoryNodes
      tags: [memory-graph]
      summary: Get specific entities by exact name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Matching entities plus relations touching them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/context:
    get:
      operationId: getMyMemoryContext
      tags: [memory-graph]
      summary: Retrieve memory relevant to a query, formatted for prompt injection
      description: >-
        Searches nodes matching query and formats the result as a Markdown
        block capped to approximately max_tokens (rough estimate, 4 chars ≈
        1 token). Returns an empty string when there is nothing relevant.
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: max_tokens
          in: query
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Formatted context block
          content:
            application/json:
              schema:
                type: object
                properties:
                  context: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/workspace/chat/stream:
    post:
      operationId: streamWorkspaceChat
      tags: [workspace-chat]
      summary: Send a message to a personal Workspace Chat session and stream back the reply
      description: >-
        A personal, user-scoped playground for trying providers/models/tools
        live against a real LLM (web_search, rag_search, read_document_url),
        distinct from the async cloud job scheduler. The response body is
        newline-delimited JSON (one WorkspaceChatEvent object per line), not
        a JSON document — read it as a stream, not with a single JSON parse.
        session_id is client-generated and identifies one conversation;
        reusing it across calls continues the same in-memory SDK session
        (recent history remembered) until it's evicted after 2 hours of
        inactivity. Turns are also persisted to the database so a page
        refresh can reload the conversation via GET
        /users/me/workspace/chat/sessions/{sessionID}, but only for 48 hours -
        this remains a transient test surface, not a durable chat history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceChatStreamInput" }
      responses:
        "200":
          description: Newline-delimited stream of WorkspaceChatEvent objects
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/WorkspaceChatEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users/me/workspace/chat/sessions/{sessionID}:
    get:
      operationId: getWorkspaceChatSession
      tags: [workspace-chat]
      summary: Reload a persisted Workspace Chat conversation
      description: >-
        Scoped to the requesting user; a session created by another user is
        indistinguishable from one that never existed. A session past the
        48-hour retention window returns 404 rather than an empty/expired
        marker, since the console treats both cases identically (start fresh).
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The persisted conversation, ordered oldest to newest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChatSessionHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workspace-chat/sessions:
    get:
      operationId: listWorkspaceChatSessions
      tags: [workspace-chat]
      summary: List an organization's Workspace Chat sessions across every member
      description: >-
        The admin-visibility counterpart to getWorkspaceChatSession above -
        metadata (who, when, how many messages) across an organization's
        members, not any one person's own conversation content. Requires
        organization.manage. Sessions past the 48-hour retention window are
        excluded, same as getWorkspaceChatSession's own "gone once past the
        window" behavior.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Workspace Chat session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      sessions:
                        type: array
                        items: { $ref: "#/components/schemas/WorkspaceChatSessionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/skill-repos:
    get:
      operationId: listSkillRepos
      tags: [skill-repos]
      summary: List an organization's curated skill repos
      description: >-
        Open to any member of the organization, not gated behind a specific
        permission — these are public repo URLs, nothing secret to protect.
        A caller who isn't a member of the organization at all is rejected.
        Falls back to whichever organization is flagged as the platform
        default when this org has none of its own (see each row's `source`)
        - unlike provider-settings/embedder-settings/MCP servers, this
        fallback lives directly in this list rather than a separate resolve
        endpoint, since there's no secret data here to keep out of it.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Skill repo list
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill_repos:
                    type: array
                    items: { $ref: "#/components/schemas/SkillRepo" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSkillRepo
      tags: [skill-repos]
      summary: Add a skill repo to the organization's registry
      description: Requires skills_registry.manage or organization.manage. One entry per (organization, name).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillRepoInput" }
      responses:
        "201":
          description: Skill repo created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillRepo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/skill-repos/{skillRepoID}:
    parameters:
      - name: skillRepoID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateSkillRepo
      tags: [skill-repos]
      summary: Update a skill repo
      description: Requires skills_registry.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillRepoUpdateInput" }
      responses:
        "200":
          description: Updated skill repo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillRepo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSkillRepo
      tags: [skill-repos]
      summary: Remove a skill repo from the organization's registry
      description: Requires skills_registry.manage or organization.manage.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agent-presets:
    get:
      operationId: listAgentPresets
      tags: [agent-presets]
      summary: List an organization's shared agent presets
      description: >-
        Open to any member of the organization, not gated behind a specific
        permission — a preset's system prompt is not a secret. A caller who
        isn't a member of the organization at all is rejected.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Agent preset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_presets:
                    type: array
                    items: { $ref: "#/components/schemas/AgentPreset" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAgentPreset
      tags: [agent-presets]
      summary: Add an agent preset to the organization's registry
      description: Requires agents_registry.manage or organization.manage. One entry per (organization, slug).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPresetInput" }
      responses:
        "201":
          description: Agent preset created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPreset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/agent-presets/{agentPresetID}:
    parameters:
      - name: agentPresetID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateAgentPreset
      tags: [agent-presets]
      summary: Update an agent preset
      description: Requires agents_registry.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPresetUpdateInput" }
      responses:
        "200":
          description: Updated agent preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPreset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAgentPreset
      tags: [agent-presets]
      summary: Remove an agent preset from the organization's registry
      description: Requires agents_registry.manage or organization.manage.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/me/quota-usage:
    get:
      operationId: getMyQuotaUsage
      tags: [quota-usage]
      summary: Get my own usage counters
      description: >-
        Self-service only — there is no {userID} variant. Pure counting, no
        enforced limit: this just lists the counters back.
      responses:
        "200":
          description: My usage counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/quota-usage/increment:
    post:
      operationId: incrementMyQuotaUsage
      tags: [quota-usage]
      summary: Increment one of my own usage counters
      description: >-
        Bumps both the daily and monthly bucket for (me, metric) by delta
        (minimum 1). Called by a connected seshat-backend after a real
        action (chat query, file upload, ingestion) — never by end-user UI
        directly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncrementUsageInput" }
      responses:
        "204": { description: Incremented }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Application list. `client_secret` is redacted on every entry
            except the one returned by the create call below.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      applications:
                        type: array
                        items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createApplication
      tags: [applications]
      summary: Register a client application
      description: >
        Requires `applications.manage` or `organization.manage`. The server
        generates `client_id`/`client_secret`; this response is the only
        place the real `client_secret` is ever returned in full.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Application created (client_secret shown in full once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/applications/{applicationID}:
    parameters:
      - name: applicationID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      description: Requires `applications.read`, `applications.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application
      description: >
        `client_secret` is immutable via this endpoint (not part of the
        request body) and redacted in the response. Unlike creation,
        `organization_id` is not part of this body — an application cannot be
        moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdateInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List upstream identity providers
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Provider list. `client_secret` is always redacted — the value is
            caller-supplied, so it is never echoed back in full, even at
            creation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProvider
      tags: [providers]
      summary: Register an upstream identity provider
      description: Requires `providers.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Provider created (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/providers/{providerID}:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider
      description: Requires `providers.read`, `providers.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        provider cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdateInput" }
      responses:
        "200":
          description: Updated provider (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      description: Fails while any application still references this provider.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/scim-connections:
    get:
      operationId: getScimConnection
      tags: [scim-connections]
      summary: Get an organization's SCIM connection
      description: >-
        A singleton per organization_id, like GET /web-search-org-policy —
        not a path-parameterized collection. Returns `{"connection": null}`
        (200, not 404) when the organization has not configured SCIM yet;
        "not configured" is a normal state for this resource. Never
        includes the bearer token. Requires scim_connections.read/.manage
        or organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: The organization's SCIM connection, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection:
                    oneOf:
                      - $ref: "#/components/schemas/ScimConnection"
                      - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createScimConnection
      tags: [scim-connections]
      summary: Create an organization's SCIM connection
      description: >-
        One connection per organization — a second call for an org that
        already has one is rejected with 409; delete the existing one or
        rotate its token instead. Returns the bearer token in the
        `token` field — the only time it is ever readable again, same
        "shown once" contract as an Invitation or Device registration
        token. Requires scim_connections.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimConnectionInput" }
      responses:
        "201":
          description: SCIM connection created, with its one-time bearer token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimConnectionWithToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    put:
      operationId: updateScimConnection
      tags: [scim-connections]
      summary: Update an organization's SCIM connection
      description: >-
        Edits name/enabled/sync options only — never touches the bearer
        token, use the rotate-token operation for that. 404 if the
        organization has no SCIM connection configured yet. Requires
        scim_connections.manage or organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimConnectionUpdateInput" }
      responses:
        "200":
          description: SCIM connection updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteScimConnection
      tags: [scim-connections]
      summary: Delete an organization's SCIM connection
      description: >-
        Any IdP still configured with the old token starts getting 401s
        immediately. Does not touch previously provisioned users/
        memberships/groups — it only stops future pushes from being
        accepted. Requires scim_connections.manage or organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: SCIM connection deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/scim-connections/rotate-token:
    post:
      operationId: rotateScimConnectionToken
      tags: [scim-connections]
      summary: Rotate an organization's SCIM connection bearer token
      description: >-
        Replaces the bearer token — the previous one stops working
        immediately, the IdP's configured secret must be updated to match.
        Returns the new raw token, the one and only time it is readable
        again. Requires scim_connections.manage or organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Token rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimConnectionWithToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/scim-connections/events:
    get:
      operationId: listScimConnectionEvents
      tags: [scim-connections]
      summary: List an organization's SCIM connection's recent protocol activity
      description: >-
        The "recent activity" feed backing ScimConnection's health fields —
        most recent first. Requires scim_connections.read/.manage or
        organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Recent SCIM sync events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/ScimSyncEvent" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/provider-catalog:
    get:
      operationId: listProviderCatalog
      tags: [provider-settings]
      summary: List the providers/models the connected SDK build supports
      description: >-
        Static, non-secret metadata resolved live from the seshat SDK's own
        registry rather than a hand-maintained copy — seshat-console
        previously hardcoded its own copy of this list, which had already
        drifted out of sync with the SDK once. Returned in the SDK's own
        curated display order. Any authenticated user may read this; it
        carries no organization-specific data.
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderCatalogEntry" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/provider-settings:
    get:
      operationId: listProviderSettings
      tags: [provider-settings]
      summary: List LLM providers configured for an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        provider_settings.read/manage/organization.manage gets an empty
        list, not a 403. The API key is never included, in this or any
        other response.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProviderSetting
      tags: [provider-settings]
      summary: Store credentials for one LLM provider
      description: >-
        Requires provider_settings.manage or organization.manage. One
        provider per organization — creating a second setting for the same
        (organization, provider) pair is rejected; use update instead. The
        api_key is AES-256-GCM encrypted at rest and never echoed back, not
        even in this response — it's a caller-supplied secret, the same
        redaction rule already applied to Provider.client_secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingInput" }
      responses:
        "201":
          description: Provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/provider-settings/resolve:
    get:
      operationId: resolveProviderSetting
      tags: [provider-settings]
      summary: Resolve the effective, usable provider config for an organization
      description: >-
        Unlike every other provider-settings endpoint, this INCLUDES the
        decrypted api_key — the point is for a connected seshat-backend to
        actually make the LLM call with it, not to administer the setting.
        Authorization is deliberately looser than provider_settings.read/
        manage: any member of the organization (or a platform admin) can
        resolve "what should I use", the same trust level as using their own
        session — unless an admin has scoped one or more policy bindings to
        this specific provider setting, in which case only matching
        subjects may resolve it (403 otherwise). Falls back to the platform
        default when the organization has no setting of its own for this
        provider; 404 if neither exists.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved provider config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/usable:
    get:
      operationId: listUsableProviderSettings
      tags: [provider-settings]
      summary: List the provider settings the caller may pick from (e.g. a chat provider dropdown)
      description: >-
        Unlike GET /provider-settings (admin-only, for the settings/
        credentials page), authorization here is the same loose "any member
        of the organization" trust level as /provider-settings/resolve — no
        secret is included, just which providers are configured and their
        default model. A provider setting is usable by every member by
        default; an admin can restrict a specific one to chosen members or
        teams by scoping one or more policy bindings to it
        (resource_type=provider_setting, resource_id=<setting id>) — the
        moment any such binding exists, that setting is hidden from this
        list for every other subject.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Usable provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/provider-settings/{providerSettingID}:
    parameters:
      - name: providerSettingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProviderSetting
      tags: [provider-settings]
      summary: Get a provider setting
      responses:
        "200":
          description: Provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProviderSetting
      tags: [provider-settings]
      summary: Update a provider setting
      description: >
        An empty/omitted api_key leaves the stored credential unchanged.
        Unlike creation, `organization_id`/`provider` are not part of this
        body — an existing setting's organization and provider are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingUpdateInput" }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProviderSetting
      tags: [provider-settings]
      summary: Delete a provider setting
      description: Cloud jobs depending on this provider will start failing at execution time with a clear reason; existing jobs are not touched or deleted.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/{providerSettingID}/set-default:
    post:
      operationId: setProviderSettingDefault
      tags: [provider-settings]
      summary: Flag this provider setting as its organization's "main" one
      description: Administrative/UI only - not consumed by job execution (jobs always name their provider explicitly). Clears the flag from whichever other provider setting in the same organization currently holds it.
      parameters:
        - name: providerSettingID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/{providerSettingID}/unset-default:
    post:
      operationId: unsetProviderSettingDefault
      tags: [provider-settings]
      summary: Clear the "main" flag from this provider setting
      parameters:
        - name: providerSettingID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/detect-models:
    post:
      operationId: detectProviderModels
      tags: [provider-settings]
      summary: Probe a live Ollama instance for its installed LLM models
      description: >-
        Only does anything for provider "ollama" — every other provider has
        a static model catalog in the console already, since a hosted
        provider's model list doesn't vary per install. A self-hosted
        Ollama's installed models do, so this calls its /api/tags endpoint
        live. Embedding models are already filtered out of the result.
        Returns an empty list (never an error status) if the target Ollama
        is unreachable, so the console can fall back to manual model entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectModelsInput" }
      responses:
        "200":
          description: Detected models (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectedProviderModels" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/web-search-provider-settings:
    get:
      operationId: listWebSearchProviderSettings
      tags: [web-search-provider-settings]
      summary: List web-search providers configured for an organization
      description: >-
        Scoped visibility like listProviderSettings: a caller lacking
        web_search_settings.manage/organization.manage gets an empty list,
        not a 403. The API key is never included, in this or any other
        response.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Web-search provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  web_search_provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/WebSearchProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Store credentials for one web-search provider
      description: >-
        Requires web_search_settings.manage or organization.manage. One
        provider per organization — creating a second setting for the same
        (organization, provider) pair is rejected; use update instead.
        auth_username is only meaningful for searxng (HTTP basic auth); the
        api_key is AES-256-GCM encrypted at rest and never echoed back, not
        even in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchProviderSettingInput" }
      responses:
        "201":
          description: Web-search provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/web-search-provider-settings/resolve:
    get:
      operationId: resolveWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Resolve the effective, usable web-search provider config for an organization
      description: >-
        Unlike every other web-search-provider-settings endpoint, this
        INCLUDES the decrypted api_key (and auth_username, for searxng) —
        the point is for a connected seshat-backend to actually call the
        provider with it, not to administer the setting. Authorization is
        deliberately looser than web_search_settings.manage: any member of
        the organization can resolve "what should I use". Falls back to the
        platform default when the organization has no setting of its own
        for this provider; 404 if neither exists.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved web-search provider config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedWebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/web-search-provider-settings/{webSearchProviderSettingID}:
    parameters:
      - name: webSearchProviderSettingID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Update a web-search provider setting
      description: >-
        An empty/omitted api_key leaves the stored credential unchanged.
        Unlike creation, organization_id/provider are not part of this body
        — an existing setting's organization and provider are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchProviderSettingUpdateInput" }
      responses:
        "200":
          description: Updated web-search provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Delete a web-search provider setting
      description: Local resolution falls back to the platform default (or fails) at next use; nothing else is touched.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/web-search-org-policy:
    get:
      operationId: getWebSearchOrgPolicy
      tags: [web-search-org-policy]
      summary: Get an organization's web-search domain policy
      description: >-
        Open to any org member (a domain policy isn't secret, and every
        member needs to read it to have it applied locally). Returns an
        empty policy (both lists empty), not 404, when the organization has
        never set one.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Web-search domain policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchOrgPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: upsertWebSearchOrgPolicy
      tags: [web-search-org-policy]
      summary: Replace an organization's web-search domain policy
      description: >-
        Requires web_search_settings.manage or organization.manage. Full
        replace, not a merge — send the complete allowed/blocked lists each
        time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchOrgPolicyInput" }
      responses:
        "200":
          description: Updated web-search domain policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchOrgPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp-server-configs:
    get:
      operationId: listMCPServerConfigs
      tags: [mcp-server-configs]
      summary: List an organization's shared MCP server configs
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        mcp_registry.manage/organization.manage gets an empty list, not a
        403. env/headers values are never included, in this or any other
        response except resolve.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: MCP server config list
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_server_configs:
                    type: array
                    items: { $ref: "#/components/schemas/MCPServerConfig" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createMCPServerConfig
      tags: [mcp-server-configs]
      summary: Define a new shared MCP server for an organization
      description: >-
        Requires mcp_registry.manage or organization.manage. One config per
        (organization, name) pair — creating a second config with the same
        name is rejected; use update instead. env/headers values are
        AES-256-GCM encrypted at rest and never echoed back, not even in
        this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerConfigInput" }
      responses:
        "201":
          description: MCP server config created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/mcp-server-configs/resolve:
    get:
      operationId: resolveMCPServerConfigs
      tags: [mcp-server-configs]
      summary: Resolve every MCP server config an organization has shared
      description: >-
        Unlike the list endpoint, this INCLUDES decrypted env/headers
        values — the point is for a connected seshat-backend to actually
        load these servers into its local MCP runtime, once the user has
        explicitly approved each one (stdio servers spawn an arbitrary
        command locally). Authorization is deliberately looser than
        mcp_registry.manage: any member of the organization can resolve
        "what has my org shared". Falls back to whichever organization is
        flagged as the platform default when this org has none of its own
        (same hybrid model as provider-settings/embedder-settings) - an org
        with even one server of its own never sees the default org's
        servers mixed in.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Resolved MCP server configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_server_configs:
                    type: array
                    items: { $ref: "#/components/schemas/ResolvedMCPServerConfig" }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp-server-configs/{mcpServerConfigID}:
    parameters:
      - name: mcpServerConfigID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMCPServerConfig
      tags: [mcp-server-configs]
      summary: Update a shared MCP server config
      description: >-
        An empty/omitted env/headers value leaves the stored secret
        unchanged for that field. Unlike creation, organization_id/name are
        not part of this body — an existing config's organization and name
        are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerConfigUpdateInput" }
      responses:
        "200":
          description: Updated MCP server config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMCPServerConfig
      tags: [mcp-server-configs]
      summary: Delete a shared MCP server config
      description: >-
        Any member who had already approved this server locally keeps
        running it until their next reload — deleting here only stops it
        from being resolved/loaded going forward.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora:
    get:
      operationId: listCorpora
      tags: [knowledge]
      summary: List an organization's knowledge-base corpora
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        knowledge.read/knowledge.manage/organization.manage gets an empty
        list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Corpus list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      corpora:
                        type: array
                        items: { $ref: "#/components/schemas/Corpus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createCorpus
      tags: [knowledge]
      summary: Create a corpus
      description: Requires knowledge.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorpusInput" }
      responses:
        "201":
          description: Corpus created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corpus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/knowledge/corpora/{corpusID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCorpus
      tags: [knowledge]
      summary: Get a corpus
      responses:
        "200":
          description: Corpus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corpus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateCorpus
      tags: [knowledge]
      summary: Rename/redescribe a corpus, or move it in or out of a folder
      description: Requires knowledge.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorpusUpdateInput" }
      responses:
        "200":
          description: Updated corpus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corpus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCorpus
      tags: [knowledge]
      summary: Delete a corpus
      description: >-
        Requires knowledge.manage or organization.manage. Removes the
        corpus's files, ingestion jobs, and its entire vector namespace.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/files:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listCorpusFiles
      tags: [knowledge]
      summary: List the files attached to a corpus
      responses:
        "200":
          description: Corpus file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/CorpusFile" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadCorpusFile
      tags: [knowledge]
      summary: Upload a file into a corpus
      description: >-
        Requires knowledge.manage or organization.manage. Multipart form
        upload with a single "file" field, capped at 25 MiB. When the
        server's RAG service is configured, ingestion is auto-enqueued;
        otherwise the file is stored and attached as pending, and
        POST .../ingestion-jobs can be used once an embedder is set up (see
        the platform-provider-settings-shaped follow-up in ROADMAP.md).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: File uploaded and attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/files/{fileID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: fileID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: detachCorpusFile
      tags: [knowledge]
      summary: Detach a file from its corpus
      description: >-
        Requires knowledge.manage or organization.manage. Removes the
        file's ingested vector chunks (if any) and adjusts the corpus's
        chunk total.
      responses:
        "204": { description: Detached }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/files/{fileID}/ingest:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: fileID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: ingestCorpusFile
      tags: [knowledge]
      summary: Re-trigger ingestion for an already-uploaded file
      description: >-
        Requires knowledge.manage or organization.manage. Upgrades a file
        ingested vectorless (no embedder configured at the time) to real
        vectors once one is set up, or retries one that never got a job at
        all — returns the existing queued/running job unchanged if one is
        already in flight for this file.
      responses:
        "200":
          description: Ingestion job queued (or the existing in-flight one)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listIngestionJobs
      tags: [knowledge]
      summary: List ingestion jobs for a corpus
      responses:
        "200":
          description: Ingestion job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_jobs:
                    type: array
                    items: { $ref: "#/components/schemas/IngestionJob" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs/{jobID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getIngestionJob
      tags: [knowledge]
      summary: Get an ingestion job
      responses:
        "200":
          description: Ingestion job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs/{jobID}/retry:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryIngestionJob
      tags: [knowledge]
      summary: Retry a failed ingestion job
      description: Requires knowledge.manage or organization.manage. Only jobs in the "failed" state can be retried.
      responses:
        "200":
          description: Ingestion job requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/search:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: searchCorpus
      tags: [knowledge]
      summary: Search a corpus
      description: >-
        Requires knowledge.read/knowledge.manage or organization.manage.
        Returns a 400 if the server's RAG service isn't configured yet (no
        embedder set up — see ROADMAP.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                top_k: { type: integer, minimum: 1, maximum: 20, description: "Defaults to 5." }
              required: [query]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connectors/accounts:
    get:
      operationId: listConnectorAccounts
      tags: [connectors]
      summary: List an organization's connector accounts
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        knowledge.read/knowledge.manage/organization.manage gets an empty
        list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Connector account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector_accounts:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorAccount" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createConnectorAccount
      tags: [connectors]
      summary: Connect a new external source
      description: >-
        Requires knowledge.manage or organization.manage. Only kind "s3" is
        available today (Google Drive/SharePoint are a fast-follow, see
        docs/architecture.md's "Example: Knowledge connectors") — an
        S3-compatible bucket is connected and starts syncing immediately, no
        OAuth step. Secrets are encrypted at rest and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorAccountInput" }
      responses:
        "201":
          description: Connector account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/connectors/accounts/{accountID}:
    parameters:
      - name: accountID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateConnectorAccount
      tags: [connectors]
      summary: Edit an existing s3 or azureblob connector account's configuration
      description: >-
        Requires knowledge.manage or organization.manage. Closes a real gap:
        a connected account's own configuration (bucket/endpoint/prefix or
        account_name/container, plus credentials) was stored server-side but
        never exposed or editable — the only way to fix a typo'd endpoint or
        rotate a leaked key was to delete and reconnect from scratch. kind is
        fixed (not part of this body, same convention as every other
        *UpdateInput here) — only s3/azureblob accounts have static config
        to edit; every OAuth-based kind (gdrive/sharepoint/onedrive/
        confluence/slack/outlook/teams/gmail) is rejected here, since
        reconnecting via the OAuth flow already handles credential rotation
        for those. access_key_id/secret_access_key (s3) or account_key
        (azureblob) are optional — leave blank to keep the existing
        encrypted credential(s) unchanged; for s3, access_key_id and
        secret_access_key must be provided together, not one at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorAccountUpdateInput" }
      responses:
        "200":
          description: Connector account updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteConnectorAccount
      tags: [connectors]
      summary: Disconnect an external source
      description: >-
        Requires knowledge.manage or organization.manage. Removes the
        connector account and its sync job history — already-ingested corpus
        files are left in place (detach them individually if that's the
        intent).
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connectors/accounts/{accountID}/sync:
    parameters:
      - name: accountID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: triggerConnectorSync
      tags: [connectors]
      summary: Queue an immediate sync for a connector account
      description: >-
        Requires knowledge.manage or organization.manage. In addition to the
        account's own periodic sync_interval_seconds schedule. Returns the
        already-queued/running job unchanged if one exists.
      responses:
        "200":
          description: Sync job (queued or already in flight)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorSyncJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connectors/accounts/{accountID}/sync-jobs:
    parameters:
      - name: accountID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listConnectorSyncJobs
      tags: [connectors]
      summary: List a connector account's sync job history, newest first
      responses:
        "200":
          description: Sync job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sync_jobs:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorSyncJob" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connectors/my-accounts:
    get:
      operationId: listMyConnectorAccounts
      tags: [connectors]
      summary: List the caller's own agent_action-purposed connector accounts
      description: >-
        Self-service counterpart to listConnectorAccounts — any org member
        may call this for their own accounts, no knowledge.read/manage or
        organization.manage required. Only returns purpose=agent_action
        accounts created by the caller.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: The caller's own connector account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector_accounts:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorAccount" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/connectors/my-accounts/{accountID}:
    parameters:
      - name: accountID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteMyConnectorAccount
      tags: [connectors]
      summary: Disconnect one of the caller's own agent_action accounts
      description: >-
        Self-service counterpart to deleteConnectorAccount — succeeds only
        for an agent_action account the caller themselves created; 404 (not
        403) for any other account, including one owned by someone else.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/connectors/oauth-apps:
    get:
      operationId: listConnectorOAuthApps
      tags: [connectors]
      summary: List an organization's registered connector OAuth apps
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        knowledge.read/knowledge.manage/organization.manage gets an empty
        list, not a 403. Client secrets are never returned, only whether one
        is configured.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: OAuth app list
          content:
            application/json:
              schema:
                type: object
                properties:
                  oauth_apps:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectorOAuthApp" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/connectors/oauth-apps/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [gdrive, sharepoint, onedrive, confluence, slack, outlook, teams, gmail] }
    put:
      operationId: registerConnectorOAuthApp
      tags: [connectors]
      summary: Register or update an organization's OAuth app for gdrive/sharepoint/slack/outlook/teams/gmail
      description: >-
        Requires knowledge.manage or organization.manage. client_secret is
        required the first time an app is registered for this
        (organization, kind); omit it on a later update to keep the existing
        one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorOAuthAppInput" }
      responses:
        "200":
          description: OAuth app registered/updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorOAuthApp" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/connectors/{kind}/oauth/start:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [gdrive, sharepoint, onedrive, confluence, slack, outlook, teams, gmail] }
    post:
      operationId: beginConnectorOAuth
      tags: [connectors]
      summary: Start a "connect an account" OAuth flow for gdrive/sharepoint/onedrive/confluence/slack/outlook/teams/gmail
      description: >-
        Requires that the organization has already registered an OAuth app
        for kind. With purpose=knowledge_sync (the default), also requires
        knowledge.manage or organization.manage and a valid corpus_id -
        this is the admin-run flow for gdrive/sharepoint/onedrive/confluence. With
        purpose=agent_action, only requires organization membership and no
        corpus_id - any employee connects their own account for their own
        future MCP-backed agent actions; slack/outlook/teams/gmail only
        support this purpose.
        Returns a URL to open in a new browser tab; the resulting
        ConnectorAccount is created by the callback once the user completes
        the provider's consent screen, not by this call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginConnectorOAuthInput" }
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorization_url: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/connectors/{kind}/oauth/callback:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [gdrive, sharepoint, onedrive, confluence, slack, outlook, teams, gmail] }
    get:
      operationId: completeConnectorOAuth
      tags: [connectors]
      summary: OAuth redirect target - not called directly by API clients
      description: >-
        Public, unauthenticated - the identity provider redirects the
        browser here after consent. Trust comes from the single-use signed
        state issued by the start endpoint. Returns an HTML page, not JSON.
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "200":
          description: HTML result page
          content:
            text/html:
              schema: { type: string }

  /api/v1/embedder-settings:
    get:
      operationId: getEmbedderSetting
      tags: [knowledge]
      summary: Get an organization's embedder configuration
      description: >-
        A singleton per organization — at most one embedder is active for
        a given org at a time, since a corpus's vectors are all produced
        by whichever embedder was active at ingest time. 404 if none is
        configured (the organization then falls back to the platform
        default, if any, at ingest/search time).
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Embedder setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setEmbedderSetting
      tags: [knowledge]
      summary: Create or update an organization's embedder configuration
      description: >-
        Requires knowledge.manage or organization.manage. Upsert — creates
        the organization's embedder setting if none exists yet, otherwise
        updates it in place. api_key empty means "no key" on first create
        (valid for an unauthenticated local Ollama) and "keep the existing
        key unchanged" when a setting already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedderSettingInput" }
      responses:
        "200":
          description: Embedder setting created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteEmbedderSetting
      tags: [knowledge]
      summary: Delete an organization's embedder configuration
      description: >-
        Requires knowledge.manage or organization.manage. The organization
        falls back to the platform default (if any) for subsequent
        ingest/search calls; existing corpora are not re-embedded.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/embedder-settings/detect-models:
    post:
      operationId: detectEmbedderModels
      tags: [knowledge]
      summary: Detect embedding-capable models for a provider
      description: >-
        For OpenAI-compatible providers this returns a static curated list
        (their model catalogs don't vary per install). For "ollama" it
        probes the target instance's /api/tags live and classifies each
        installed model as embedding-capable by name/family heuristics,
        since a self-hosted Ollama's installed models are unknowable ahead
        of time. Returns an empty list (never an error status) if the
        target Ollama is unreachable, so the console can fall back to
        manual model entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectModelsInput" }
      responses:
        "200":
          description: Detected embedding models (possibly empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectedEmbedderModels" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/organization-preferences:
    get:
      operationId: getOrganizationPreferences
      tags: [preferences]
      summary: Get an organization's preference defaults
      description: >-
        A singleton per organization — this organization's OWN values only,
        no platform-default fallback (an admin editing their org's
        preferences needs to see exactly what's set for THIS org). Requires
        organization.manage. 404 if none is configured. A member's
        effective preferences (personal value, else this, else the
        platform-default organization's) are visible via
        GET /api/v1/users/me/preferences instead, not here.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Organization preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setOrganizationPreferences
      tags: [preferences]
      summary: Create or update an organization's preference defaults
      description: >-
        Requires organization.manage. Upsert — creates the organization's
        preferences if none exist yet, otherwise updates them in place.
        Only fields that also exist at the personal level are supported
        here (working_style, response_style, extra_context, the two
        permission modes, max_sub_agent_depth) — preferred_name/profession/
        about only make sense per-person and have no organization
        equivalent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPreferencesInput" }
      responses:
        "200":
          description: Organization preferences created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteOrganizationPreferences
      tags: [preferences]
      summary: Delete an organization's preference defaults
      description: >-
        Requires organization.manage. Members of this organization fall
        back to the platform-default organization's preferences (if any and
        shared) for subsequent GET /api/v1/users/me/preferences calls.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices in an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        devices.read/devices.manage/organization.manage gets an empty list,
        not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register the caller's own machine as a device
      description: >-
        Self-service: any org member may register a device for themselves.
        The bearer token is shown in full only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name]
              properties:
                organization_id: { type: string }
                name: { type: string }
                platform: { type: string, example: darwin }
                app_version: { type: string, example: "1.4.0" }
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDeviceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{deviceID}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device
      description: Requires devices.manage/organization.manage, or being the user who registered the device.
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/device/heartbeat:
    post:
      operationId: deviceHeartbeat
      tags: [device-protocol]
      summary: Report device liveness
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Updated device, plus its resolved desktop policy bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs in an organization
      description: Scoped visibility — a caller lacking jobs.read/jobs.manage/organization.manage gets an empty list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createJob
      tags: [jobs]
      summary: Define a new scheduled automation
      description: Requires jobs.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job's trigger and payload
      description: >
        Unlike creation, `organization_id` is not part of this body — a job
        cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobUpdateInput" }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/pause:
    post:
      operationId: pauseJob
      tags: [jobs]
      summary: Pause a job
      description: A paused job is skipped by the scheduler even past its next_run_at.
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/resume:
    post:
      operationId: resumeJob
      tags: [jobs]
      summary: Resume a paused job
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/run:
    post:
      operationId: triggerJobNow
      tags: [jobs]
      summary: Queue an immediate run outside the job's normal schedule
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: >-
            Queued run. For execution_target=cloud this comes back already
            failed — seshat-server has no LLM provider credential
            infrastructure yet, so the absorbed Runner has nothing to
            execute with (see Run.exit_reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/runs:
    get:
      operationId: listJobRuns
      tags: [jobs, runs]
      summary: List runs for one job
      description: >
        Sortable fields: `queued_at`, `status`, `execution_target`. `q`
        searches id, job_id, organization_id, execution_target,
        assigned_device_id, status, exit_reason, output_text, error_text and
        metadata.
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      runs:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs in an organization
      description: >
        Scoped visibility — a caller lacking
        jobs.read/jobs.manage/organization.manage gets an empty list, not a
        403. Sortable fields: `queued_at`, `status`, `execution_target`. `q`
        searches id, job_id, organization_id, execution_target,
        assigned_device_id, status, exit_reason, output_text, error_text and
        metadata.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: job_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [queued, claimed, running, completed, failed, cancelled] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      runs:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/runs/{runID}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/runs/{runID}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run that hasn't finished yet
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs:
    get:
      operationId: myRuns
      tags: [device-protocol]
      summary: List every non-terminal run currently assigned to this device
      description: >-
        State-reconciliation call for the local backend on startup/reconnect:
        returns queued, claimed and running runs owned by the calling
        device, including ones claimed before a crash that were never
        reported back. A claimed/running run left silent for too long
        (default 10 minutes, SESHAT_SERVER_STALE_RUN_TIMEOUT) is
        automatically failed by the scheduler with exit_reason "device went
        silent..." — this endpoint lets the device notice and react before
        that timeout fires.
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Non-terminal runs assigned to this device
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/device/runs/claim:
    post:
      operationId: claimRun
      tags: [device-protocol]
      summary: Claim the oldest queued run assigned to this device
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Claimed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: "Nothing currently queued for this device — normal during polling, not an error." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/device/runs/{runID}/job:
    get:
      operationId: getDeviceRunJob
      tags: [device-protocol]
      summary: Read the execution payload for a run this device currently holds
      description: >
        Returns the job's `prompt`/`model_override`/`configuration` — the
        job/run claim response itself (`Run`) carries only tracking fields,
        never the payload, so a device needs this call after claiming to
        know what to actually execute. Scoped by run, not by a bare job id:
        requires the calling device to be `assigned_device_id` on a run in
        `claimed` or `running` state for that job. There is no broader
        device-accessible route to read arbitrary jobs.
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job execution payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/start:
    post:
      operationId: startRun
      tags: [device-protocol]
      summary: Confirm the device has begun executing a claimed run
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/heartbeat:
    post:
      operationId: heartbeatRun
      tags: [device-protocol]
      summary: Record that a running run is still alive
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/complete:
    post:
      operationId: completeRun
      tags: [device-protocol]
      summary: Record a successful run outcome
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                output_text: { type: string }
      responses:
        "200":
          description: Completed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/fail:
    post:
      operationId: failRun
      tags: [device-protocol]
      summary: Record a failed run outcome
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                error_text: { type: string }
      responses:
        "200":
          description: Failed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/prospecting/sweeps:
    get:
      operationId: listProspectingSweeps
      tags: [prospecting]
      summary: List an organization's sweeps, newest first
      description: Requires prospecting.read, prospecting.manage, or organization.manage.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Sweep list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sweeps:
                    type: array
                    items: { $ref: "#/components/schemas/Sweep" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: sweepProspectingArea
      tags: [prospecting]
      summary: Start a new business-discovery sweep, or continue an existing one
      description: >-
        Requires prospecting.manage — spends the organization's own Google
        Places budget (see prospecting.read/prospecting.manage and the
        organization's ProspectingSettings.daily_cap). Pass sweep_id to
        continue an already-started sweep from where it left off — when set,
        every other field is ignored and the sweep's own stored values are
        used instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SweepAreaInput" }
      responses:
        "200":
          description: The sweep's current state after this call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sweep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/prospecting/sweeps/{sweepID}/businesses:
    parameters:
      - name: sweepID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listProspectingBusinesses
      tags: [prospecting]
      summary: List one sweep's discovered businesses
      description: Requires prospecting.read or prospecting.manage.
      parameters:
        - name: min_score
          in: query
          schema: { type: integer }
          description: Minimum reachability_score (0-100).
        - name: has_phone
          in: query
          schema: { type: boolean }
        - name: sector
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Business list
          content:
            application/json:
              schema:
                type: object
                properties:
                  businesses:
                    type: array
                    items: { $ref: "#/components/schemas/Business" }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/prospecting/settings:
    get:
      operationId: getProspectingSettings
      tags: [prospecting]
      summary: Get an organization's Prospecting settings
      description: >-
        Requires prospecting.read, prospecting.manage, or
        organization.manage. Strict BYOK — there is no platform-default
        Places API key, unlike embedder settings.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Prospecting settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProspectingSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setProspectingSettings
      tags: [prospecting]
      summary: Create or update an organization's Prospecting settings
      description: >-
        Requires prospecting.manage or organization.manage. api_key is
        required on first creation; omit on update to keep the existing key
        unchanged (there is no keyless provider, unlike an embedder's
        platform-default fallback).
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProspectingSettingsInput" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProspectingSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque session token returned by bootstrap/login, sent as `Authorization: Bearer <token>`."
    deviceBearerAuth:
      type: http
      scheme: bearer
      description: >-
        Device token returned once by POST /devices at registration time —
        distinct from a user session token. Resolves to a Device, not a
        Principal; never accepted on user-authenticated endpoints and vice
        versa.

  parameters:
    organizationIDPath:
      name: organizationID
      in: path
      required: true
      schema: { type: string }
    userIDPath:
      name: userID
      in: path
      required: true
      schema: { type: string }
    organizationIDQuery:
      name: organization_id
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Max items per page (default 50, capped at 200).
      schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    sort:
      name: sort
      in: query
      description: Field to sort by; valid values are endpoint-specific (see each list's `sort` in the response).
      schema: { type: string }
    order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc] }
    q:
      name: q
      in: query
      description: Free-text search, fields vary per resource.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist (or is hidden from this caller)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Uniqueness or state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }

    ListMeta:
      type: object
      properties:
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
        sort: { type: string }
        order: { type: string }
        query: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        website_url: { type: string }
        support_email: { type: string, format: email }
        is_default:
          type: boolean
          description: Whether this organization's own ProviderSetting/EmbedderSetting/WebSearchProviderSetting/MCPServerConfig rows are used as the platform-wide fallback for organizations with no config of their own. At most one organization holds this at a time.
        is_active:
          type: boolean
          description: Administrative/visual flag only - not enforced on any request path yet.
        share_provider_settings:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's LLM provider credentials are actually shared as the platform-wide fallback. Lets an admin keep IsDefault for some domains while excluding others.
        share_embedder_settings:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's embedder configuration is shared as the platform-wide fallback.
        share_web_search_settings:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's web-search provider credentials are shared as the platform-wide fallback.
        share_mcp_servers:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's MCP server configs are shared as the platform-wide fallback.
        share_skill_repos:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's skill repos are shared as the platform-wide fallback.
        share_organization_preferences:
          type: boolean
          description: Only meaningful while is_default is true - whether this organization's preference defaults are shared as the platform-wide fallback.
        domain:
          type: string
          description: >-
            This organization's own email domain (e.g. "acmecorp.com"), if
            set. Self-service registration (POST /auth/register) auto-joins
            a new user to this organization as a pending member when their
            email matches — but only once domain_verified_at is set; a
            claimed-but-unverified domain grants no auto-join. At most one
            organization holds a given domain.
        domain_verification_token:
          type: string
          description: >-
            The value to publish as a DNS TXT record at
            _seshat-challenge.<domain> (as "seshat-verification=<token>") to
            prove ownership — see POST .../verify-domain. Regenerated
            whenever domain changes to a new value. Absent once verified or
            when no domain is set.
        domain_verified_at:
          type: string
          format: date-time
          description: Absent until POST .../verify-domain succeeds. Reset to unset whenever domain changes to a different value.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        website_url: { type: string }
        support_email: { type: string, format: email }
        domain: { type: string }

    # All fields optional - omit one to leave that domain's flag unchanged.
    OrganizationSharedDomainsInput:
      type: object
      properties:
        share_provider_settings: { type: boolean }
        share_embedder_settings: { type: boolean }
        share_web_search_settings: { type: boolean }
        share_mcp_servers: { type: boolean }
        share_skill_repos: { type: boolean }
        share_organization_preferences: { type: boolean }

    Membership:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        organization_id: { type: string }
        role:
          type: string
          description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
        status:
          type: string
          enum: [active, pending, blocked]
          description: >-
            "active" (default) has full access. "pending" (self-registered
            via a matched organization email domain) also has full access,
            just flagged for admin attention - see pending_since and
            POST /memberships/{id}/confirm. "blocked" (past the
            confirmation window unconfirmed) has no access at all, as if
            the membership didn't exist.
        pending_since:
          type: string
          format: date-time
          description: Set when status is "pending" - when the confirmation window (SESHAT_SERVER_MEMBERSHIP_CONFIRMATION_WINDOW) started counting down.
        created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string }
          description: >-
            The resolved effective permission set (role + custom role +
            policy bindings + group membership) for this membership's role,
            in this organization, at fetch time. Only populated on the
            session-bootstrap paths (bootstrap/register/login/auth-me) —
            clients should check for e.g. "organization.manage" here rather
            than hardcoding role names, since custom roles can grant the
            same permission under any name.
        user_email:
          type: string
          description: Denormalized for display - resolving a teammate's identity from a membership shouldn't require a separate admin-only user lookup.
        user_display_name: { type: string }
        user_is_admin:
          type: boolean
          description: Whether this member also holds platform-admin privileges (User.is_admin), denormalized for display.

    Session:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      description: Admin-facing session view; exposes a stable id instead of the raw token.
      properties:
        id: { type: string }
        user_id: { type: string }
        user_email: { type: string, format: email }
        user_display_name: { type: string }
        organization_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id:
          type: string
          description: Empty for the 4 built-in system roles, set for custom roles.
        organization_id:
          type: string
          description: Empty for the 4 built-in system roles, which are global.
        code:
          type: string
          description: >
            "owner"/"admin"/"member"/"viewer" for system roles; lowercase
            letters/digits/hyphen/underscore for custom roles. Not an enum —
            organizations can define arbitrary custom role codes.
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        system:
          type: boolean
          description: True for the 4 built-in roles, which cannot be updated or deleted.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoleInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { type: string }
        code:
          type: string
          description: >
            Lowercase letters/digits/hyphen/underscore, cannot reuse a
            reserved system role code. On update, omitting this keeps the
            role's current code; setting it renames the role (cascades to
            memberships/invitations/policy-bindings referencing the old code).
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }

    Invitation:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        token: { type: string }
        invited_by_user_id: { type: string }
        accepted_by_user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    InvitationPreview:
      type: object
      properties:
        organization_name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        expires_at: { type: string, format: date-time }
        valid: { type: boolean }

    Group:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupInput:
      type: object
      required: [organization_id, name, slug]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }

    # Distinct from GroupInput: a group can't be moved between organizations
    # via update, and the handler rejects unknown fields (organization_id
    # included), same reasoning as ApplicationUpdateInput.
    GroupUpdateInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }

    PolicyBinding:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        permission_codes:
          type: array
          items: { type: string }
        resource_type:
          type: string
          description: Optional resource kind this binding is scoped to ("corpus" or "provider_setting"). Empty means organization-wide.
        resource_id:
          type: string
          description: ID of the specific resource this binding is scoped to. Empty when resource_type is empty.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyBindingInput:
      type: object
      required: [organization_id, name, subject_type, subject_id, permission_codes]
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        permission_codes:
          type: array
          items: { type: string }
        resource_type:
          type: string
          description: Optional resource kind to scope this binding to ("corpus" or "provider_setting"). Omit for an organization-wide binding.
        resource_id:
          type: string
          description: ID of the specific resource to scope this binding to. Required when resource_type is set.

    # Distinct from PolicyBindingInput: same organization_id/unknown-fields
    # reasoning as GroupUpdateInput above.
    PolicyBindingUpdateInput:
      type: object
      required: [name, subject_type, subject_id, permission_codes]
      properties:
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        resource_type:
          type: string
          description: Optional resource kind to scope this binding to ("corpus" or "provider_setting"). Omit for an organization-wide binding.
        resource_id:
          type: string
          description: ID of the specific resource to scope this binding to. Required when resource_type is set.
        permission_codes:
          type: array
          items: { type: string }

    DesktopPolicy:
      type: object
      description: >
        One entry from the fixed, code-defined desktop policy catalog - this
        is not admin-editable data, only its per-organization assignment
        (DesktopPolicyBinding) is.
      properties:
        code: { type: string }
        admin_description: { type: string }
        user_blocked_message:
          type: string
          description: Shown to the end user when this policy blocks an action.
        default_value:
          type: boolean
          description: Effective value when no DesktopPolicyBinding applies to a given subject at all.

    DesktopPolicyBinding:
      type: object
      description: >
        Assigns a value for one policy_code from the fixed catalog to one
        subject. Resolution ANDs every applicable binding together with the
        catalog's own default ("most restrictive wins") - see
        DesktopPolicyBindingInput's description for the subject vocabulary.
      properties:
        id: { type: string }
        organization_id: { type: string }
        policy_code: { type: string }
        subject_type: { type: string, enum: [org, role, user, group] }
        subject_id:
          type: string
          description: Empty when subject_type is "org".
        value: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DesktopPolicyBindingInput:
      type: object
      required: [organization_id, policy_code, subject_type, value]
      properties:
        organization_id: { type: string }
        policy_code: { type: string }
        subject_type:
          type: string
          enum: [org, role, user, group]
          description: >
            "org" restricts every member of the organization and requires
            subject_id to be empty; "role"/"user"/"group" narrow the
            restriction to that specific role code, member, or team.
        subject_id:
          type: string
          description: Required for every subject_type except "org".
        value: { type: boolean }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        actor_user_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }

    UserPreferences:
      type: object
      description: A strictly personal, one-row-per-user record — no organization_id.
      properties:
        user_id: { type: string }
        preferred_name: { type: string }
        profession: { type: string }
        about: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }
        updated_at: { type: string, format: date-time }

    UserPreferencesInput:
      type: object
      properties:
        preferred_name: { type: string }
        profession: { type: string }
        about: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }

    UserMemory:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [preference, instruction, pattern, fact, context], example: fact }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1 }
        source: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserMemoryInput:
      type: object
      required: [key]
      properties:
        type: { type: string, enum: [preference, instruction, pattern, fact, context], default: fact }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        source: { type: string }

    # Distinct from UserMemoryInput: every field is optional (partial update) —
    # same reasoning as every other *UpdateInput in this spec.
    UserMemoryUpdateInput:
      type: object
      properties:
        type: { type: string, enum: [preference, instruction, pattern, fact, context] }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1 }
        source: { type: string }

    MemoryEntity:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        entity_type: { type: string }
        observations: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemoryEntityInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        entity_type: { type: string, default: entity }
        observations: { type: array, items: { type: string } }

    MemoryRelation:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        from: { type: string, description: Entity name }
        to: { type: string, description: Entity name }
        relation_type: { type: string }
        created_at: { type: string, format: date-time }

    MemoryObservationInput:
      type: object
      required: [entity_name]
      properties:
        entity_name: { type: string }
        contents: { type: array, items: { type: string } }

    MemoryObservationResult:
      type: object
      properties:
        entity_name: { type: string }
        added_observations: { type: array, items: { type: string } }

    MemoryGraph:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntity" }
        relations:
          type: array
          items: { $ref: "#/components/schemas/MemoryRelation" }

    SkillRepo:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string, example: seshat-skills }
        url: { type: string, example: "https://github.com/EngineerProjects/seshat-skills" }
        description: { type: string }
        source:
          type: string
          enum: [organization, platform]
          description: >-
            "organization" is this org's own row, editable/deletable by this
            org's admins. "platform" means this org has none of its own and
            this was inherited from whichever organization is flagged
            is_default (see Organization.share_skill_repos) - read-only from
            here, since it doesn't actually belong to this organization.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillRepoInput:
      type: object
      required: [organization_id, name, url]
      properties:
        organization_id: { type: string }
        name: { type: string, example: seshat-skills }
        url: { type: string, example: "https://github.com/EngineerProjects/seshat-skills" }
        description: { type: string }

    # Distinct from SkillRepoInput: organization_id is immutable after creation.
    SkillRepoUpdateInput:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }

    AgentPreset:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        slug: { type: string, example: researcher }
        name: { type: string, example: Researcher }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentPresetInput:
      type: object
      required: [organization_id, slug]
      properties:
        organization_id: { type: string }
        slug: { type: string, example: researcher }
        name: { type: string, example: Researcher }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }

    # Distinct from AgentPresetInput: organization_id and slug are immutable after creation.
    AgentPresetUpdateInput:
      type: object
      properties:
        name: { type: string }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }

    UsageEntry:
      type: object
      properties:
        metric: { type: string, example: queries }
        period: { type: string, enum: [day, month] }
        period_key: { type: string, example: "2026-07-14" }
        count: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    UsageSummary:
      type: object
      properties:
        user_id: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/UsageEntry" }

    IncrementUsageInput:
      type: object
      required: [metric]
      properties:
        metric: { type: string, example: queries }
        delta: { type: integer, format: int64, default: 1 }

    Application:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2] }
        enabled: { type: boolean }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        client_id: { type: string }
        client_secret:
          type: string
          description: Full value only in the create response; redacted (e.g. `secret_ab********`) everywhere else.
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationInput:
      type: object
      required: [organization_id, name, slug, display_name]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2], default: oidc }
        enabled: { type: boolean, default: true }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from ApplicationInput: an application can't be moved between
    # organizations via update, and the handler rejects unknown fields, so
    # organization_id must not be part of this schema (unlike the create body).
    ApplicationUpdateInput:
      type: object
      required: [name, slug, display_name]
      properties:
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2], default: oidc }
        enabled: { type: boolean, default: true }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    Provider:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean }
        client_id: { type: string }
        client_secret:
          type: string
          description: Always redacted in API responses — caller-supplied, never echoed back in full.
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate:
          type: string
          description: Public verification certificate (not a secret).
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: When a completed OIDC/SAML login round trip through this connection last finished, success or failure. Null if never attempted.
        last_login_success:
          type: boolean
          nullable: true
          description: Whether that last completed login succeeded. Null if never attempted.
        last_error:
          type: string
          description: Error message from the last failed login attempt, empty if the last attempt succeeded or none has happened yet.

    ProviderInput:
      type: object
      required: [organization_id, name, slug, kind]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean, default: true }
        client_id: { type: string }
        client_secret: { type: string }
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate: { type: string }
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from ProviderInput: same organization_id/unknown-fields
    # reasoning as ApplicationUpdateInput above.
    ProviderUpdateInput:
      type: object
      required: [name, slug, kind]
      properties:
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean, default: true }
        client_id: { type: string }
        client_secret: { type: string }
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate: { type: string }
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    AuthResult:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    RegisterInput:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        display_name: { type: string }

    ProviderSetting:
      type: object
      description: Never includes the API key — it's a caller-supplied secret, redacted in every response including create.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        provider: { type: string, example: anthropic }
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        is_default:
          type: boolean
          description: Administrative/UI marker for this organization's "main" provider setting - not consumed by job execution.

    ScimConnection:
      type: object
      description: Never includes the bearer token — see ScimConnectionWithToken for the one-time reveal on create/rotate.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string, example: Okta }
        enabled: { type: boolean }
        sync_groups:
          type: boolean
          description: When false, every /Groups write is rejected outright (403) — the connection never agreed to accept group pushes at all.
        auto_create_teams:
          type: boolean
          description: >-
            Only has an effect when sync_groups is true. false ("metadata
            only"): a /Groups push is recorded for admin visibility but
            never creates or modifies a real team. true: a real team is
            created/updated, fully addressable afterward.
        last_sync_at:
          type: string
          format: date-time
          description: Timestamp of the most recent SCIM protocol operation against this connection, of any kind. Absent if none has ever occurred.
        last_sync_success:
          type: boolean
          description: Whether that most recent operation succeeded. Absent if none has ever occurred.
        last_error:
          type: string
          description: The most recent operation's error message — only present when last_sync_success is false. A later success clears it.

    ScimConnectionWithToken:
      allOf:
        - $ref: "#/components/schemas/ScimConnection"
        - type: object
          properties:
            token:
              type: string
              description: The raw bearer token — shown exactly once, on create or rotate. Never returned by any other operation.

    ScimConnectionInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { type: string }
        name: { type: string, example: Okta }
        sync_groups: { type: boolean }
        auto_create_teams: { type: boolean }

    ScimConnectionUpdateInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        sync_groups: { type: boolean }
        auto_create_teams: { type: boolean }

    ScimSyncEvent:
      type: object
      description: One SCIM protocol operation against a connection — the "recent activity" feed, and the source health is derived from (see ScimConnection.last_sync_at/last_sync_success).
      properties:
        id: { type: string }
        operation: { type: string, example: user.create }
        resource_type: { type: string, enum: [User, Group] }
        external_id: { type: string }
        success: { type: boolean }
        error_message: { type: string }
        created_at: { type: string, format: date-time }

    ProviderCatalogModel:
      type: object
      properties:
        id: { type: string, example: claude-sonnet-4-20250514 }
        description: { type: string }
        context_window: { type: integer }
        max_output: { type: integer }

    ProviderCatalogEntry:
      type: object
      properties:
        name: { type: string, example: anthropic }
        display_name: { type: string, example: Anthropic }
        description: { type: string }
        auth_type: { type: string, enum: [api_key, oauth, none, aws, gcp] }
        auth_types:
          type: array
          items: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/ProviderCatalogModel" }

    ResolvedProviderSetting:
      type: object
      description: >-
        Unlike ProviderSetting, this includes the decrypted api_key — see
        the resolveProviderSetting operation.
      properties:
        provider: { type: string, example: mistral }
        default_model: { type: string, example: mistral-small-latest }
        base_url: { type: string }
        api_key: { type: string }
        source:
          type: string
          enum: [organization, platform]
          description: >-
            "organization" if the requesting org had its own setting;
            "platform" if it fell back to the organization currently
            flagged as the platform default.

    ProviderSettingInput:
      type: object
      required: [organization_id, provider]
      properties:
        organization_id: { type: string }
        provider: { type: string, example: anthropic }
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        api_key:
          type: string
          description: Required on create.

    # Distinct from ProviderSettingInput: the update handler's request struct
    # has neither organization_id nor provider (an existing setting's org and
    # provider are fixed; DisallowUnknownFields rejects them if sent), same
    # reasoning as every other *UpdateInput in this spec.
    ProviderSettingUpdateInput:
      type: object
      properties:
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        api_key:
          type: string
          description: Omit/empty to keep the existing stored key unchanged.

    # Shared by detectProviderModels and detectEmbedderModels — both only
    # probe live for provider "ollama", every other provider already has a
    # static catalog client-side.
    DetectModelsInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, example: ollama }
        base_url:
          type: string
          description: Defaults to http://localhost:11434 (Ollama's own default) if omitted.

    DetectedProviderModels:
      type: object
      properties:
        models:
          type: array
          items: { type: string }
          description: Empty for non-Ollama providers, or if the target Ollama was unreachable.
        error:
          type: string
          description: Set only if the probe failed (models is still present, just empty).

    WebSearchProviderSetting:
      type: object
      description: >-
        Never includes the API key — it's a caller-supplied secret, redacted
        in every response including create. No default_model field, unlike
        ProviderSetting — a web-search provider has no such concept.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username:
          type: string
          description: Only meaningful for searxng (HTTP basic auth username).

    ResolvedWebSearchProviderSetting:
      type: object
      description: >-
        Unlike WebSearchProviderSetting, this includes the decrypted
        api_key — see the resolveWebSearchProviderSetting operation.
      properties:
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username: { type: string }
        api_key: { type: string }
        source:
          type: string
          enum: [organization, platform]
          description: >-
            "organization" if the requesting org had its own setting;
            "platform" if it fell back to the organization currently
            flagged as the platform default.

    WebSearchProviderSettingInput:
      type: object
      required: [organization_id, provider]
      properties:
        organization_id: { type: string }
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username: { type: string }
        api_key:
          type: string
          description: Required on create.

    # Distinct from WebSearchProviderSettingInput: the update handler's
    # request struct has neither organization_id nor provider (an existing
    # setting's org and provider are fixed), same reasoning as every other
    # *UpdateInput in this spec.
    WebSearchProviderSettingUpdateInput:
      type: object
      properties:
        base_url: { type: string }
        auth_username: { type: string }
        api_key:
          type: string
          description: Omit/empty to keep the existing stored key unchanged.

    WebSearchOrgPolicy:
      type: object
      properties:
        organization_id: { type: string }
        created_by_user_id: { type: string }
        allowed_domains: { type: array, items: { type: string } }
        blocked_domains: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }

    WebSearchOrgPolicyInput:
      type: object
      required: [organization_id]
      properties:
        organization_id: { type: string }
        allowed_domains: { type: array, items: { type: string } }
        blocked_domains: { type: array, items: { type: string } }

    WorkspaceChatStreamInput:
      type: object
      required: [session_id, organization_id, provider, model, message]
      properties:
        session_id:
          type: string
          description: Client-generated - identifies one conversation across calls.
        organization_id: { type: string }
        provider: { type: string, example: anthropic }
        model: { type: string, example: claude-sonnet-5 }
        corpus_id:
          type: string
          description: Optional - enables rag_search/rag_ingest scoped to this organization's embedder when set.
        message:
          type: string
          description: The user's new message. Prior turns are remembered server-side via session_id, not resent here.

    WorkspaceChatEvent:
      type: object
      description: One line of the newline-delimited response stream.
      required: [type]
      properties:
        type:
          type: string
          enum: [text_delta, thinking_delta, tool_progress, done, error]
        delta:
          type: string
          description: Present for text_delta/thinking_delta - an incremental text fragment to append.
        tool:
          $ref: "#/components/schemas/WorkspaceChatToolProgress"
        message:
          type: string
          description: Present for the error event.

    WorkspaceChatToolProgress:
      type: object
      description: Present on tool_progress events. Emitted once per stage as the tool call happens (pending/running/completed/failed); web_search calls get a second "completed" event once the turn finishes, with the fully structured web_search field replacing the plain-text summary.
      properties:
        name: { type: string, example: web_search }
        tool_use_id: { type: string }
        stage: { type: string, enum: [pending, running, completed, failed] }
        summary:
          type: string
          description: Human-readable progress text (or a truncated result summary on completion).
        query:
          type: string
          description: The tool's input query, when it has one (e.g. web_search).
        web_search:
          $ref: "#/components/schemas/WorkspaceChatWebSearchTrace"

    WorkspaceChatWebSearchTrace:
      type: object
      properties:
        query: { type: string }
        count: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              description: { type: string }
              source: { type: string }

    WorkspaceChatSessionHistory:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceChatHistoryMessage" }

    WorkspaceChatHistoryMessage:
      type: object
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        events:
          type: array
          description: Present for assistant messages only - the ordered event log of that turn, replayable through the same client-side reducer used for live streaming to reconstruct identical content/trace.
          items: { $ref: "#/components/schemas/WorkspaceChatEvent" }

    WorkspaceChatSessionSummary:
      type: object
      description: >-
        Metadata only - no message content. The admin-visibility list
        (listWorkspaceChatSessions) shows this across every member of an
        organization; a specific conversation's actual messages stay behind
        the owner-scoped getWorkspaceChatSession, which has no admin-override
        path at all.
      properties:
        id: { type: string }
        user_id: { type: string }
        user_email: { type: string }
        user_display_name: { type: string }
        title: { type: string }
        message_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MCPServerConfig:
      type: object
      description: Never includes env/headers values — they're a caller-supplied secret, redacted in every response including create.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string, example: internal-jira }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket], example: stdio }
        command: { type: string, description: Only meaningful for server_type=stdio. }
        args: { type: array, items: { type: string } }
        url: { type: string, description: Only meaningful for server_type=http/sse/websocket. }
        timeout_secs: { type: integer }
        icon: { type: string }
        connector_kind: { type: string, enum: ["", gdrive, sharepoint, slack, outlook, teams, gmail], description: "When set, this server's headers are personalized per caller at resolve time - see ResolvedMCPServerConfig.connected." }

    ResolvedMCPServerConfig:
      type: object
      description: >-
        Unlike MCPServerConfig, this includes the decrypted env/headers
        maps — see the resolveMCPServerConfigs operation.
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string }, description: "May include an Authorization: Bearer entry personalized for the calling principal when connector_kind is set - see connected." }
        timeout_secs: { type: integer }
        icon: { type: string }
        connector_kind: { type: string, enum: ["", gdrive, sharepoint, slack, outlook, teams, gmail] }
        connected: { type: boolean, description: "Always true when connector_kind is empty. When connector_kind is set, true only if the calling principal has their own connected agent_action ConnectorAccount for that kind - false means this server was returned but has no Bearer header injected (the calling employee hasn't connected their own account yet)." }

    MCPServerConfigInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { type: string }
        name: { type: string, example: internal-jira }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket], default: stdio }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: Encrypted at rest. Optional on create.
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Encrypted at rest. Optional on create.
        timeout_secs: { type: integer, default: 30 }
        icon: { type: string }
        connector_kind: { type: string, enum: ["", gdrive, sharepoint, slack, outlook, teams, gmail], description: "See MCPServerConfig.connector_kind. Empty (default) means static config only." }

    # Distinct from MCPServerConfigInput: the update handler's request
    # struct has neither organization_id nor name (an existing config's
    # organization and name are fixed), same reasoning as every other
    # *UpdateInput in this spec.
    MCPServerConfigUpdateInput:
      type: object
      properties:
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: Omit to keep the existing stored env unchanged.
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Omit to keep the existing stored headers unchanged.
        timeout_secs: { type: integer }
        icon: { type: string }
        connector_kind: { type: string, enum: ["", gdrive, sharepoint, slack, outlook, teams, gmail] }

    Corpus:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string }
        description: { type: string }
        chunk_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CorpusInput:
      type: object
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
      required: [organization_id, name]

    # Distinct from CorpusInput: organization_id is immutable after creation.
    CorpusUpdateInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    CorpusFile:
      type: object
      properties:
        id: { type: string }
        corpus_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string, enum: [pending, ingested, failed] }
        chunk_count: { type: integer }
        ingested_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        source: { type: string, enum: [upload, connector], description: "\"connector\" for a file pulled in by a Knowledge connector sync, \"upload\" for a manually uploaded one." }
        connector_account_id: { type: string, description: "Set only when source is \"connector\"." }

    ConnectorAccount:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        corpus_id: { type: string, description: "Set only for a knowledge_sync-purposed account - empty for agent_action." }
        kind: { type: string, enum: [s3, azureblob, gdrive, sharepoint, onedrive, confluence, slack, outlook, teams, gmail] }
        purpose: { type: string, enum: [knowledge_sync, agent_action], description: "knowledge_sync: admin-run, feeds a corpus. agent_action: self-service, one employee's own account for their own future MCP-backed agent actions - see connectors' package doc." }
        display_name: { type: string }
        external_account_id: { type: string }
        status: { type: string, enum: [connected, error, disconnected] }
        sync_interval_seconds: { type: integer }
        last_synced_at: { type: string, format: date-time }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        bucket: { type: string, description: "s3 only." }
        region: { type: string, description: "s3 only." }
        endpoint: { type: string, description: "s3 only." }
        prefix: { type: string, description: "s3 and azureblob only." }
        account_name: { type: string, description: "azureblob only: the storage account name." }
        container: { type: string, description: "azureblob only: the blob container name." }

    ConnectorAccountInput:
      type: object
      description: >-
        Kinds "s3" and "azureblob" are supported here. For "s3":
        bucket/region/endpoint/prefix and access_key_id/secret_access_key
        apply (region defaults to "us-east-1" if omitted). For "azureblob":
        account_name/container/prefix and account_key apply. Each kind only
        requires its own fields - the required list below is a union.
      properties:
        organization_id: { type: string }
        corpus_id: { type: string }
        kind: { type: string, enum: [s3, azureblob], description: "Defaults to \"s3\"." }
        display_name: { type: string }
        bucket: { type: string }
        region: { type: string }
        endpoint: { type: string }
        prefix: { type: string }
        access_key_id: { type: string }
        secret_access_key: { type: string }
        account_name: { type: string, description: "azureblob only: the storage account name." }
        container: { type: string, description: "azureblob only: the blob container name." }
        account_key: { type: string, description: "azureblob only: the storage account's shared key." }
        sync_interval_seconds: { type: integer, description: "Defaults to 3600 (1 hour)." }
      required: [organization_id, corpus_id, display_name]

    ConnectorAccountUpdateInput:
      type: object
      description: >-
        Same shape as ConnectorAccountInput minus the create-only,
        immutable fields (organization_id/corpus_id/kind - kind comes from
        the existing account, not this body). access_key_id/
        secret_access_key (s3) or account_key (azureblob) are optional -
        leave blank to keep the existing encrypted credential(s) unchanged;
        for s3, access_key_id and secret_access_key must be provided
        together, not one at a time.
      properties:
        display_name: { type: string }
        bucket: { type: string }
        region: { type: string }
        endpoint: { type: string }
        prefix: { type: string }
        access_key_id: { type: string }
        secret_access_key: { type: string }
        account_name: { type: string, description: "azureblob only: the storage account name." }
        container: { type: string, description: "azureblob only: the blob container name." }
        account_key: { type: string, description: "azureblob only: the storage account's shared key." }
        sync_interval_seconds: { type: integer, description: "Defaults to 3600 (1 hour)." }
      required: [display_name]

    ConnectorSyncJob:
      type: object
      properties:
        id: { type: string }
        connector_account_id: { type: string }
        corpus_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        items_synced: { type: integer }
        last_error: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ConnectorOAuthApp:
      type: object
      description: The client secret is never returned, only whether one is configured.
      properties:
        kind: { type: string, enum: [gdrive, sharepoint, onedrive, confluence, slack, outlook, teams, gmail] }
        client_id: { type: string }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }

    ConnectorOAuthAppInput:
      type: object
      properties:
        organization_id: { type: string }
        client_id: { type: string }
        client_secret: { type: string, description: "Required the first time an app is registered for this (organization, kind); omit on a later update to keep the existing one." }
      required: [organization_id, client_id]

    BeginConnectorOAuthInput:
      type: object
      description: >-
        purpose=knowledge_sync (default, omit to get this) requires
        corpus_id and knowledge.manage/organization.manage. purpose=
        agent_action is self-service (any org member, no special
        permission) - corpus_id must be omitted, rejected if present.
      properties:
        organization_id: { type: string }
        corpus_id: { type: string, description: "Required for purpose=knowledge_sync, must be omitted for purpose=agent_action." }
        purpose: { type: string, enum: [knowledge_sync, agent_action], default: knowledge_sync }
        display_name: { type: string, description: "Optional - defaults to the connected account's email/UPN once the flow completes." }
        sync_interval_seconds: { type: integer, description: "Defaults to 3600 (1 hour). Ignored for purpose=agent_action." }
      required: [organization_id]

    IngestionJob:
      type: object
      properties:
        id: { type: string }
        corpus_id: { type: string }
        corpus_file_id: { type: string }
        filename: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        chunk_count: { type: integer }
        last_error: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SearchResponse:
      type: object
      properties:
        corpus_id: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              text: { type: string }
              score: { type: number, format: float }
              metadata: { type: object, additionalProperties: { type: string } }

    EmbedderSetting:
      type: object
      description: Never includes the API key — same redaction stance as ProviderSetting.
      properties:
        id: { type: string }
        organization_id: { type: string }
        provider: { type: string, enum: [openai, ollama] }
        model: { type: string, example: text-embedding-3-small }
        base_url: { type: string }

    EmbedderSettingInput:
      type: object
      properties:
        organization_id: { type: string }
        provider: { type: string, enum: [openai, ollama] }
        model: { type: string, example: text-embedding-3-small }
        base_url: { type: string }
        api_key:
          type: string
          description: Optional (e.g. a local Ollama needs none). Empty on update keeps the existing key unchanged.
      required: [provider, model, base_url]

    OrganizationPreferences:
      type: object
      description: >-
        Default values for the subset of UserPreferences fields that make
        sense at an organization scope — deliberately excludes
        preferred_name/profession/about, which only make sense per-person.
      properties:
        organization_id: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }
        updated_at: { type: string, format: date-time }

    OrganizationPreferencesInput:
      type: object
      properties:
        organization_id: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }
      required: [organization_id]

    DetectedEmbedderModels:
      type: object
      properties:
        embedding_models:
          type: array
          items: { type: string }
          description: >-
            A static curated list for non-Ollama providers, or the subset of
            a live Ollama instance's installed models classified as
            embedding-capable by name/family. Empty if the target Ollama was
            unreachable.
        error:
          type: string
          description: Set only if a live Ollama probe failed (embedding_models is still present, just empty).

    Device:
      type: object
      description: The device's bearer token is never part of this view — see RegisterDeviceResult for the one-time reveal.
      properties:
        id: { type: string }
        organization_id: { type: string }
        registered_by_user_id: { type: string }
        name: { type: string }
        platform: { type: string }
        app_version: { type: string }
        status: { type: string, enum: [active, revoked] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HeartbeatResult:
      description: >
        The Device fields, plus this device's resolved desktop policy
        bundle - keyed by policy code (see DesktopPolicy.code), value is
        whether that policy currently allows the action. A code absent from
        this map (an old server predating a newer client's expectations)
        should be treated as allowed by the client - see the desktop
        policies plan's fail-open design.
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            policies:
              type: object
              additionalProperties: { type: boolean }

    RegisterDeviceResult:
      type: object
      properties:
        device: { $ref: "#/components/schemas/Device" }
        token:
          type: string
          description: Full device bearer token, shown in full only in this response.

    Job:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, paused] }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time, nullable: true }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_run_status:
          type: string
          enum: [queued, claimed, running, completed, failed, cancelled]
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobInput:
      type: object
      required: [organization_id, name, trigger_type, execution_target, prompt]
      description: >-
        cron_expr is required when trigger_type=cron; interval_seconds when
        trigger_type=interval; run_at when trigger_type=once.
        target_device_id is required when execution_target=device.
        model_override is required when execution_target=cloud, format
        "provider:model" (e.g. "anthropic:claude-sonnet-5") — the provider
        prefix picks which of the organization's provider-settings to run
        against; there must be one configured (POST /provider-settings) or
        the run fails with a clear reason.
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string, example: "0 0 * * *" }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time }
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string, example: "anthropic:claude-sonnet-5" }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from JobInput: the update handler's request struct has no
    # organization_id (a job can't be moved between organizations via
    # update), same reasoning as every other *UpdateInput in this spec.
    JobUpdateInput:
      type: object
      required: [name, trigger_type, execution_target, prompt]
      properties:
        name: { type: string }
        description: { type: string }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string, example: "0 0 * * *" }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time }
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string, example: "anthropic:claude-sonnet-5" }
        configuration:
          type: object
          additionalProperties: { type: string }

    Run:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        organization_id: { type: string }
        execution_target: { type: string, enum: [cloud, device] }
        assigned_device_id: { type: string }
        status:
          type: string
          enum: [queued, claimed, running, completed, failed, cancelled]
        queued_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_reason: { type: string }
        output_text: { type: string }
        error_text: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }

    RunJob:
      type: object
      description: >-
        Minimal execution payload for a run a device currently holds —
        deliberately not the full Job (no organization_id,
        created_by_user_id, etc.).
      properties:
        name: { type: string }
        prompt: { type: string }
        model_override: { type: string }
        configuration:
          type: object
          additionalProperties: { type: string }

    GeoPoint:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }

    Sweep:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        country: { type: string }
        area_query: { type: string }
        area_label: { type: string }
        center: { $ref: "#/components/schemas/GeoPoint" }
        radius_km: { type: number }
        sectors: { type: array, items: { type: string } }
        next_unit_index: { type: integer, description: "Progress cursor - how many grid tiles/sectors have been swept so far." }
        total_units: { type: integer, description: "Total grid tiles × sectors this sweep covers." }
        status: { type: string, enum: [running, partial, completed, failed], description: "running: freshly created, before its first call completes. partial: some tiles swept, more remain (or the daily cap was hit) - continue via sweep_id. completed: every tile swept." }
        businesses_found: { type: integer }
        real_places_calls_used: { type: integer, description: "Live Google Places API calls this sweep has spent so far, counted against the organization's daily_cap." }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    SweepAreaInput:
      type: object
      description: >-
        Set sweep_id alone to continue an existing sweep - every other
        field is then ignored. Omit sweep_id to start a new one, in which
        case organization_id/area/country are required.
      properties:
        sweep_id: { type: string, description: "Set to continue an existing sweep instead of starting a new one." }
        organization_id: { type: string }
        area: { type: string, description: "Free-text area query, e.g. \"Lyon, France\" - geocoded server-side." }
        country: { type: string }
        sectors: { type: array, items: { type: string }, description: "Business categories to search, e.g. [\"restaurant\", \"plumber\"]." }
        radius_km: { type: number }
        max_tiles: { type: integer, description: "Caps how many grid tiles this single call processes - the sweep can be continued afterward via sweep_id." }
      required: [organization_id, area, country]

    Executive:
      type: object
      properties:
        name: { type: string }
        role: { type: string }

    Business:
      type: object
      properties:
        id: { type: string }
        sweep_id: { type: string }
        place_id: { type: string }
        sector: { type: string }
        name: { type: string }
        formatted_address: { type: string }
        postal_code: { type: string }
        city: { type: string }
        location: { $ref: "#/components/schemas/GeoPoint" }
        phone: { type: string }
        website: { type: string }
        rating: { type: number }
        user_rating_count: { type: integer }
        business_status: { type: string }
        opening_hours_json: { type: string, description: "Raw JSON as returned by Google Places, not re-parsed here." }
        siren: { type: string, description: "French company registry identifier, set only when enrichment matched a company." }
        company_name: { type: string }
        executives: { type: array, items: { $ref: "#/components/schemas/Executive" } }
        match_confidence: { type: number, description: "0-1 confidence the registry enrichment match is correct." }
        reachability_score: { type: integer, description: "0-100 composite score (has phone/website, rating, matched registry data, etc.)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProspectingSettings:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        daily_cap: { type: integer, description: "Max real Google Places API calls per day, across all this org's sweeps." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProspectingSettingsInput:
      type: object
      properties:
        api_key: { type: string, description: "Google Places API key. Required on first creation; omit on update to keep the existing key unchanged." }
        daily_cap: { type: integer }
