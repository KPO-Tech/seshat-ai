  /api/v1/users/me/quota-usage:
    get:
      operationId: getMyQuotaUsage
      tags: [quota-usage]
      summary: Get my own usage counters
      description: >-
        Self-service only — there is no {userID} variant. Pure counting, no
        enforced limit: this just lists the counters back.
      responses:
        "200":
          description: My usage counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/quota-usage/increment:
    post:
      operationId: incrementMyQuotaUsage
      tags: [quota-usage]
      summary: Increment one of my own usage counters
      description: >-
        Bumps both the daily and monthly bucket for (me, metric) by delta
        (minimum 1). Called by a connected seshat-backend after a real
        action (chat query, file upload, ingestion) — never by end-user UI
        directly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncrementUsageInput" }
      responses:
        "204": { description: Incremented }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Application list. `client_secret` is redacted on every entry
            except the one returned by the create call below.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      applications:
                        type: array
                        items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createApplication
      tags: [applications]
      summary: Register a client application
      description: >
        Requires `applications.manage` or `organization.manage`. The server
        generates `client_id`/`client_secret`; this response is the only
        place the real `client_secret` is ever returned in full.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Application created (client_secret shown in full once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/applications/{applicationID}:
    parameters:
      - name: applicationID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      description: Requires `applications.read`, `applications.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application
      description: >
        `client_secret` is immutable via this endpoint (not part of the
        request body) and redacted in the response. Unlike creation,
        `organization_id` is not part of this body — an application cannot be
        moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationUpdateInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List upstream identity providers
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Provider list. `client_secret` is always redacted — the value is
            caller-supplied, so it is never echoed back in full, even at
            creation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProvider
      tags: [providers]
      summary: Register an upstream identity provider
      description: Requires `providers.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Provider created (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/providers/{providerID}:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider
      description: Requires `providers.read`, `providers.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        provider cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderUpdateInput" }
      responses:
        "200":
          description: Updated provider (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      description: Fails while any application still references this provider.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/provider-settings:
    get:
      operationId: listProviderSettings
      tags: [provider-settings]
      summary: List LLM providers configured for an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        provider_settings.read/manage/organization.manage gets an empty
        list, not a 403. The API key is never included, in this or any
        other response.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProviderSetting
      tags: [provider-settings]
      summary: Store credentials for one LLM provider
      description: >-
        Requires provider_settings.manage or organization.manage. One
        provider per organization — creating a second setting for the same
        (organization, provider) pair is rejected; use update instead. The
        api_key is AES-256-GCM encrypted at rest and never echoed back, not
        even in this response — it's a caller-supplied secret, the same
        redaction rule already applied to Provider.client_secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingInput" }
      responses:
        "201":
          description: Provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/provider-settings/resolve:
    get:
      operationId: resolveProviderSetting
      tags: [provider-settings]
      summary: Resolve the effective, usable provider config for an organization
      description: >-
        Unlike every other provider-settings endpoint, this INCLUDES the
        decrypted api_key — the point is for a connected seshat-backend to
        actually make the LLM call with it, not to administer the setting.
        Authorization is deliberately looser than provider_settings.read/
        manage: any member of the organization (or a platform admin) can
        resolve "what should I use", the same trust level as using their own
        session. Falls back to the platform default when the organization has
        no setting of its own for this provider; 404 if neither exists.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved provider config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/{providerSettingID}:
    parameters:
      - name: providerSettingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProviderSetting
      tags: [provider-settings]
      summary: Get a provider setting
      responses:
        "200":
          description: Provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProviderSetting
      tags: [provider-settings]
      summary: Update a provider setting
      description: >
        An empty/omitted api_key leaves the stored credential unchanged.
        Unlike creation, `organization_id`/`provider` are not part of this
        body — an existing setting's organization and provider are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingUpdateInput" }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProviderSetting
      tags: [provider-settings]
      summary: Delete a provider setting
      description: Cloud jobs depending on this provider will start failing at execution time with a clear reason; existing jobs are not touched or deleted.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/{providerSettingID}/set-default:
    post:
      operationId: setProviderSettingDefault
      tags: [provider-settings]
      summary: Flag this provider setting as its organization's "main" one
      description: Administrative/UI only - not consumed by job execution (jobs always name their provider explicitly). Clears the flag from whichever other provider setting in the same organization currently holds it.
      parameters:
        - name: providerSettingID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/provider-settings/{providerSettingID}/unset-default:
    post:
      operationId: unsetProviderSettingDefault
      tags: [provider-settings]
      summary: Clear the "main" flag from this provider setting
      parameters:
        - name: providerSettingID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/web-search-provider-settings:
    get:
      operationId: listWebSearchProviderSettings
      tags: [web-search-provider-settings]
      summary: List web-search providers configured for an organization
      description: >-
        Scoped visibility like listProviderSettings: a caller lacking
        web_search_settings.manage/organization.manage gets an empty list,
        not a 403. The API key is never included, in this or any other
        response.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Web-search provider setting list
          content:
            application/json:
