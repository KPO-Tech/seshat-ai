      summary: List an organization's shared MCP server configs
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        mcp_registry.manage/organization.manage gets an empty list, not a
        403. env/headers values are never included, in this or any other
        response except resolve.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: MCP server config list
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_server_configs:
                    type: array
                    items: { $ref: "#/components/schemas/MCPServerConfig" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createMCPServerConfig
      tags: [mcp-server-configs]
      summary: Define a new shared MCP server for an organization
      description: >-
        Requires mcp_registry.manage or organization.manage. One config per
        (organization, name) pair — creating a second config with the same
        name is rejected; use update instead. env/headers values are
        AES-256-GCM encrypted at rest and never echoed back, not even in
        this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerConfigInput" }
      responses:
        "201":
          description: MCP server config created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/mcp-server-configs/resolve:
    get:
      operationId: resolveMCPServerConfigs
      tags: [mcp-server-configs]
      summary: Resolve every MCP server config an organization has shared
      description: >-
        Unlike the list endpoint, this INCLUDES decrypted env/headers
        values — the point is for a connected seshat-backend to actually
        load these servers into its local MCP runtime, once the user has
        explicitly approved each one (stdio servers spawn an arbitrary
        command locally). Authorization is deliberately looser than
        mcp_registry.manage: any member of the organization can resolve
        "what has my org shared". Unlike web search's provider-by-provider
        resolve, there's no org→platform fallback here — just every server
        the organization has defined.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Resolved MCP server configs
          content:
            application/json:
              schema:
                type: object
                properties:
                  mcp_server_configs:
                    type: array
                    items: { $ref: "#/components/schemas/ResolvedMCPServerConfig" }
                  count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/mcp-server-configs/{mcpServerConfigID}:
    parameters:
      - name: mcpServerConfigID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMCPServerConfig
      tags: [mcp-server-configs]
      summary: Update a shared MCP server config
      description: >-
        An empty/omitted env/headers value leaves the stored secret
        unchanged for that field. Unlike creation, organization_id/name are
        not part of this body — an existing config's organization and name
        are fixed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerConfigUpdateInput" }
      responses:
        "200":
          description: Updated MCP server config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServerConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMCPServerConfig
      tags: [mcp-server-configs]
      summary: Delete a shared MCP server config
      description: >-
        Any member who had already approved this server locally keeps
        running it until their next reload — deleting here only stops it
        from being resolved/loaded going forward.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora:
    get:
      operationId: listCorpora
      tags: [knowledge]
      summary: List an organization's knowledge-base corpora
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        knowledge.read/knowledge.manage/organization.manage gets an empty
        list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Corpus list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      corpora:
                        type: array
                        items: { $ref: "#/components/schemas/Corpus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createCorpus
      tags: [knowledge]
      summary: Create a corpus
      description: Requires knowledge.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorpusInput" }
      responses:
        "201":
          description: Corpus created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corpus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/knowledge/corpora/{corpusID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getCorpus
      tags: [knowledge]
      summary: Get a corpus
      responses:
        "200":
          description: Corpus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Corpus" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCorpus
      tags: [knowledge]
      summary: Delete a corpus
      description: >-
        Requires knowledge.manage or organization.manage. Removes the
        corpus's files, ingestion jobs, and its entire vector namespace.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/files:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listCorpusFiles
      tags: [knowledge]
      summary: List the files attached to a corpus
      responses:
        "200":
          description: Corpus file list
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: "#/components/schemas/CorpusFile" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadCorpusFile
      tags: [knowledge]
      summary: Upload a file into a corpus
      description: >-
        Requires knowledge.manage or organization.manage. Multipart form
        upload with a single "file" field, capped at 25 MiB. When the
        server's RAG service is configured, ingestion is auto-enqueued;
        otherwise the file is stored and attached as pending, and
        POST .../ingestion-jobs can be used once an embedder is set up (see
        the platform-provider-settings-shaped follow-up in ROADMAP.md).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        "201":
          description: File uploaded and attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorpusFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/files/{fileID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: fileID
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: detachCorpusFile
      tags: [knowledge]
      summary: Detach a file from its corpus
      description: >-
        Requires knowledge.manage or organization.manage. Removes the
        file's ingested vector chunks (if any) and adjusts the corpus's
        chunk total.
      responses:
        "204": { description: Detached }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listIngestionJobs
      tags: [knowledge]
      summary: List ingestion jobs for a corpus
      responses:
        "200":
          description: Ingestion job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion_jobs:
                    type: array
                    items: { $ref: "#/components/schemas/IngestionJob" }
                  count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs/{jobID}:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getIngestionJob
      tags: [knowledge]
      summary: Get an ingestion job
      responses:
        "200":
          description: Ingestion job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/ingestion-jobs/{jobID}/retry:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryIngestionJob
      tags: [knowledge]
      summary: Retry a failed ingestion job
      description: Requires knowledge.manage or organization.manage. Only jobs in the "failed" state can be retried.
      responses:
        "200":
          description: Ingestion job requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/knowledge/corpora/{corpusID}/search:
    parameters:
      - name: corpusID
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: searchCorpus
      tags: [knowledge]
      summary: Search a corpus
      description: >-
        Requires knowledge.read/knowledge.manage or organization.manage.
        Returns a 400 if the server's RAG service isn't configured yet (no
        embedder set up — see ROADMAP.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                top_k: { type: integer, minimum: 1, maximum: 20, description: "Defaults to 5." }
              required: [query]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/embedder-settings:
    get:
      operationId: getEmbedderSetting
      tags: [knowledge]
      summary: Get an organization's embedder configuration
      description: >-
        A singleton per organization — at most one embedder is active for
        a given org at a time, since a corpus's vectors are all produced
        by whichever embedder was active at ingest time. 404 if none is
        configured (the organization then falls back to the platform
        default, if any, at ingest/search time).
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Embedder setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setEmbedderSetting
      tags: [knowledge]
      summary: Create or update an organization's embedder configuration
      description: >-
        Requires knowledge.manage or organization.manage. Upsert — creates
        the organization's embedder setting if none exists yet, otherwise
        updates it in place. api_key empty means "no key" on first create
        (valid for an unauthenticated local Ollama) and "keep the existing
        key unchanged" when a setting already exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedderSettingInput" }
      responses:
        "200":
          description: Embedder setting created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteEmbedderSetting
      tags: [knowledge]
      summary: Delete an organization's embedder configuration
      description: >-
        Requires knowledge.manage or organization.manage. The organization
        falls back to the platform default (if any) for subsequent
        ingest/search calls; existing corpora are not re-embedded.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices in an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        devices.read/devices.manage/organization.manage gets an empty list,
        not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register the caller's own machine as a device
      description: >-
        Self-service: any org member may register a device for themselves.
        The bearer token is shown in full only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name]
              properties:
                organization_id: { type: string }
                name: { type: string }
                platform: { type: string, example: darwin }
                app_version: { type: string, example: "1.4.0" }
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDeviceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{deviceID}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device
      description: Requires devices.manage/organization.manage, or being the user who registered the device.
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/device/heartbeat:
    post:
      operationId: deviceHeartbeat
      tags: [device-protocol]
      summary: Report device liveness
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs in an organization
      description: Scoped visibility — a caller lacking jobs.read/jobs.manage/organization.manage gets an empty list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createJob
      tags: [jobs]
      summary: Define a new scheduled automation
      description: Requires jobs.manage or organization.manage.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}:
    parameters:
      - name: jobID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job's trigger and payload
      description: >
        Unlike creation, `organization_id` is not part of this body — a job
        cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobUpdateInput" }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/pause:
    post:
      operationId: pauseJob
      tags: [jobs]
      summary: Pause a job
      description: A paused job is skipped by the scheduler even past its next_run_at.
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/resume:
    post:
      operationId: resumeJob
      tags: [jobs]
      summary: Resume a paused job
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/run:
    post:
      operationId: triggerJobNow
      tags: [jobs]
      summary: Queue an immediate run outside the job's normal schedule
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: >-
            Queued run. For execution_target=cloud this comes back already
            failed — seshat-server has no LLM provider credential
            infrastructure yet, so the absorbed Runner has nothing to
            execute with (see Run.exit_reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/jobs/{jobID}/runs:
    get:
      operationId: listJobRuns
      tags: [jobs, runs]
      summary: List runs for one job
      description: >
        Sortable fields: `queued_at`, `status`, `execution_target`. `q`
        searches id, job_id, organization_id, execution_target,
        assigned_device_id, status, exit_reason, output_text, error_text and
        metadata.
      parameters:
        - name: jobID
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      runs:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List runs in an organization
      description: >
        Scoped visibility — a caller lacking
        jobs.read/jobs.manage/organization.manage gets an empty list, not a
        403. Sortable fields: `queued_at`, `status`, `execution_target`. `q`
        searches id, job_id, organization_id, execution_target,
        assigned_device_id, status, exit_reason, output_text, error_text and
        metadata.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: job_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [queued, claimed, running, completed, failed, cancelled] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      runs:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/runs/{runID}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get a run
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/runs/{runID}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run that hasn't finished yet
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs:
    get:
      operationId: myRuns
      tags: [device-protocol]
      summary: List every non-terminal run currently assigned to this device
      description: >-
        State-reconciliation call for the local backend on startup/reconnect:
        returns queued, claimed and running runs owned by the calling
        device, including ones claimed before a crash that were never
        reported back. A claimed/running run left silent for too long
        (default 10 minutes, SESHAT_SERVER_STALE_RUN_TIMEOUT) is
        automatically failed by the scheduler with exit_reason "device went
        silent..." — this endpoint lets the device notice and react before
        that timeout fires.
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Non-terminal runs assigned to this device
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/device/runs/claim:
    post:
      operationId: claimRun
      tags: [device-protocol]
      summary: Claim the oldest queued run assigned to this device
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Claimed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "204": { description: "Nothing currently queued for this device — normal during polling, not an error." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/device/runs/{runID}/job:
    get:
      operationId: getDeviceRunJob
      tags: [device-protocol]
      summary: Read the execution payload for a run this device currently holds
      description: >
        Returns the job's `prompt`/`model_override`/`configuration` — the
        job/run claim response itself (`Run`) carries only tracking fields,
        never the payload, so a device needs this call after claiming to
        know what to actually execute. Scoped by run, not by a bare job id:
        requires the calling device to be `assigned_device_id` on a run in
        `claimed` or `running` state for that job. There is no broader
        device-accessible route to read arbitrary jobs.
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job execution payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/start:
    post:
      operationId: startRun
      tags: [device-protocol]
      summary: Confirm the device has begun executing a claimed run
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/heartbeat:
    post:
      operationId: heartbeatRun
      tags: [device-protocol]
      summary: Record that a running run is still alive
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/complete:
    post:
      operationId: completeRun
      tags: [device-protocol]
      summary: Record a successful run outcome
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                output_text: { type: string }
      responses:
        "200":
          description: Completed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/device/runs/{runID}/fail:
    post:
      operationId: failRun
      tags: [device-protocol]
      summary: Record a failed run outcome
      security:
        - deviceBearerAuth: []
      parameters:
        - name: runID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                error_text: { type: string }
      responses:
        "200":
          description: Failed run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Opaque session token returned by bootstrap/login, sent as `Authorization: Bearer <token>`."
    deviceBearerAuth:
      type: http
      scheme: bearer
      description: >-
        Device token returned once by POST /devices at registration time —
        distinct from a user session token. Resolves to a Device, not a
        Principal; never accepted on user-authenticated endpoints and vice
        versa.

  parameters:
    organizationIDPath:
      name: organizationID
      in: path
      required: true
      schema: { type: string }
    userIDPath:
      name: userID
      in: path
      required: true
      schema: { type: string }
    organizationIDQuery:
      name: organization_id
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Max items per page (default 50, capped at 200).
      schema: { type: integer, minimum: 0, maximum: 200, default: 50 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    sort:
      name: sort
      in: query
      description: Field to sort by; valid values are endpoint-specific (see each list's `sort` in the response).
      schema: { type: string }
    order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc] }
    q:
      name: q
      in: query
      description: Free-text search, fields vary per resource.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist (or is hidden from this caller)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Uniqueness or state conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }

    ListMeta:
      type: object
      properties:
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
        sort: { type: string }
        order: { type: string }
        query: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        website_url: { type: string }
        support_email: { type: string, format: email }
        is_default:
          type: boolean
          description: Whether this organization's own ProviderSetting/EmbedderSetting rows are used as the platform-wide fallback for organizations with no config of their own. At most one organization holds this at a time.
        is_active:
          type: boolean
          description: Administrative/visual flag only - not enforced on any request path yet.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrganizationInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        website_url: { type: string }
        support_email: { type: string, format: email }

    Membership:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        organization_id: { type: string }
        role:
          type: string
          description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
        created_at: { type: string, format: date-time }
        user_email:
          type: string
          description: Denormalized for display - resolving a teammate's identity from a membership shouldn't require a separate admin-only user lookup.
        user_display_name: { type: string }
        user_is_admin:
          type: boolean
          description: Whether this member also holds platform-admin privileges (User.is_admin), denormalized for display.

    Session:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    SessionInfo:
      type: object
      description: Admin-facing session view; exposes a stable id instead of the raw token.
      properties:
        id: { type: string }
        user_id: { type: string }
        user_email: { type: string, format: email }
        user_display_name: { type: string }
        organization_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id:
          type: string
          description: Empty for the 4 built-in system roles, set for custom roles.
        organization_id:
          type: string
          description: Empty for the 4 built-in system roles, which are global.
        code:
          type: string
          description: >
            "owner"/"admin"/"member"/"viewer" for system roles; lowercase
            letters/digits/hyphen/underscore for custom roles. Not an enum —
            organizations can define arbitrary custom role codes.
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }
        system:
          type: boolean
          description: True for the 4 built-in roles, which cannot be updated or deleted.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoleInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { type: string }
        code:
          type: string
          description: >
            Lowercase letters/digits/hyphen/underscore, cannot reuse a
            reserved system role code. On update, omitting this keeps the
            role's current code; setting it renames the role (cascades to
            memberships/invitations/policy-bindings referencing the old code).
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }

    Permission:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }

    Invitation:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        token: { type: string }
        invited_by_user_id: { type: string }
        accepted_by_user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }

    Group:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GroupInput:
      type: object
      required: [organization_id, name, slug]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }

    # Distinct from GroupInput: a group can't be moved between organizations
    # via update, and the handler rejects unknown fields (organization_id
    # included), same reasoning as ApplicationUpdateInput.
    GroupUpdateInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        member_user_ids:
          type: array
          items: { type: string }

    PolicyBinding:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        permission_codes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyBindingInput:
      type: object
      required: [organization_id, name, subject_type, subject_id, permission_codes]
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        permission_codes:
          type: array
          items: { type: string }

    # Distinct from PolicyBindingInput: same organization_id/unknown-fields
    # reasoning as GroupUpdateInput above.
    PolicyBindingUpdateInput:
      type: object
      required: [name, subject_type, subject_id, permission_codes]
      properties:
        name: { type: string }
        description: { type: string }
        subject_type: { type: string, enum: [user, group, role] }
        subject_id: { type: string }
        permission_codes:
          type: array
          items: { type: string }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        actor_user_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }

    UserPreferences:
      type: object
      description: A strictly personal, one-row-per-user record — no organization_id.
      properties:
        user_id: { type: string }
        preferred_name: { type: string }
        profession: { type: string }
        about: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }
        updated_at: { type: string, format: date-time }

    UserPreferencesInput:
      type: object
      properties:
        preferred_name: { type: string }
        profession: { type: string }
        about: { type: string }
        working_style: { type: string }
        response_style: { type: string }
        extra_context: { type: string }
        interactive_permission_mode: { type: string }
        automation_permission_mode: { type: string }
        max_sub_agent_depth: { type: integer, minimum: 0, maximum: 5 }

    UserMemory:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [preference, instruction, pattern, fact, context], example: fact }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1 }
        source: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserMemoryInput:
      type: object
      required: [key]
      properties:
        type: { type: string, enum: [preference, instruction, pattern, fact, context], default: fact }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        source: { type: string }

    # Distinct from UserMemoryInput: every field is optional (partial update) —
    # same reasoning as every other *UpdateInput in this spec.
    UserMemoryUpdateInput:
      type: object
      properties:
        type: { type: string, enum: [preference, instruction, pattern, fact, context] }
        key: { type: string }
        value: { type: string }
        importance: { type: number, minimum: 0, maximum: 1 }
        source: { type: string }

    MemoryEntity:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        entity_type: { type: string }
        observations: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MemoryEntityInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        entity_type: { type: string, default: entity }
        observations: { type: array, items: { type: string } }

    MemoryRelation:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        from: { type: string, description: Entity name }
        to: { type: string, description: Entity name }
        relation_type: { type: string }
        created_at: { type: string, format: date-time }

    MemoryObservationInput:
      type: object
      required: [entity_name]
      properties:
        entity_name: { type: string }
        contents: { type: array, items: { type: string } }

    MemoryObservationResult:
      type: object
      properties:
        entity_name: { type: string }
        added_observations: { type: array, items: { type: string } }

    MemoryGraph:
      type: object
      properties:
        entities:
          type: array
          items: { $ref: "#/components/schemas/MemoryEntity" }
        relations:
          type: array
          items: { $ref: "#/components/schemas/MemoryRelation" }

    SkillRepo:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string, example: seshat-skills }
        url: { type: string, example: "https://github.com/EngineerProjects/seshat-skills" }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SkillRepoInput:
      type: object
      required: [organization_id, name, url]
      properties:
        organization_id: { type: string }
        name: { type: string, example: seshat-skills }
        url: { type: string, example: "https://github.com/EngineerProjects/seshat-skills" }
        description: { type: string }

    # Distinct from SkillRepoInput: organization_id is immutable after creation.
    SkillRepoUpdateInput:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        description: { type: string }

    AgentPreset:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        slug: { type: string, example: researcher }
        name: { type: string, example: Researcher }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentPresetInput:
      type: object
      required: [organization_id, slug]
      properties:
        organization_id: { type: string }
        slug: { type: string, example: researcher }
        name: { type: string, example: Researcher }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }

    # Distinct from AgentPresetInput: organization_id and slug are immutable after creation.
    AgentPresetUpdateInput:
      type: object
      properties:
        name: { type: string }
        when_to_use: { type: string }
        system_prompt: { type: string }
        model: { type: string }
        tools: { type: array, items: { type: string } }
        disallowed_tools: { type: array, items: { type: string } }
        max_turns: { type: integer }
        permission_mode: { type: string }
        isolation: { type: string }
        mcp_servers: { type: array, items: { type: string } }
        icon: { type: string }
        enabled: { type: boolean }

    UsageEntry:
      type: object
      properties:
        metric: { type: string, example: queries }
        period: { type: string, enum: [day, month] }
        period_key: { type: string, example: "2026-07-14" }
        count: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    UsageSummary:
      type: object
      properties:
        user_id: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/UsageEntry" }

    IncrementUsageInput:
      type: object
      required: [metric]
      properties:
        metric: { type: string, example: queries }
        delta: { type: integer, format: int64, default: 1 }

    Application:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2] }
        enabled: { type: boolean }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        client_id: { type: string }
        client_secret:
          type: string
          description: Full value only in the create response; redacted (e.g. `secret_ab********`) everywhere else.
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationInput:
      type: object
      required: [organization_id, name, slug, display_name]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2], default: oidc }
        enabled: { type: boolean, default: true }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from ApplicationInput: an application can't be moved between
    # organizations via update, and the handler rejects unknown fields, so
    # organization_id must not be part of this schema (unlike the create body).
    ApplicationUpdateInput:
      type: object
      required: [name, slug, display_name]
      properties:
        name: { type: string }
        slug: { type: string }
        display_name: { type: string }
        description: { type: string }
        protocol: { type: string, enum: [oidc, oauth2], default: oidc }
        enabled: { type: boolean, default: true }
        homepage_url: { type: string }
        callback_url: { type: string }
        redirect_urls:
          type: array
          items: { type: string }
        post_logout_redirect_urls:
          type: array
          items: { type: string }
        allowed_origins:
          type: array
          items: { type: string }
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        scopes:
          type: array
          items: { type: string }
        provider_ids:
          type: array
          items: { type: string }
        signin_url: { type: string }
        signup_url: { type: string }
        allow_signup: { type: boolean }
        allow_password_login: { type: boolean }
        pkce_required: { type: boolean }
        skip_consent: { type: boolean }
        issue_refresh_token: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    Provider:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean }
        client_id: { type: string }
        client_secret:
          type: string
          description: Always redacted in API responses — caller-supplied, never echoed back in full.
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate:
          type: string
          description: Public verification certificate (not a secret).
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProviderInput:
      type: object
      required: [organization_id, name, slug, kind]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean, default: true }
        client_id: { type: string }
        client_secret: { type: string }
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate: { type: string }
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from ProviderInput: same organization_id/unknown-fields
    # reasoning as ApplicationUpdateInput above.
    ProviderUpdateInput:
      type: object
      required: [name, slug, kind]
      properties:
        name: { type: string }
        slug: { type: string }
        kind: { type: string, enum: [oidc, oauth2, saml] }
        enabled: { type: boolean, default: true }
        client_id: { type: string }
        client_secret: { type: string }
        issuer_url: { type: string }
        discovery_url: { type: string }
        authorization_url: { type: string }
        token_url: { type: string }
        userinfo_url: { type: string }
        jwks_url: { type: string }
        logout_url: { type: string }
        metadata_url: { type: string }
        entity_id: { type: string }
        sso_url: { type: string }
        x509_certificate: { type: string }
        scopes:
          type: array
          items: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
        claim_mappings:
          type: object
          additionalProperties: { type: string }
        allow_auto_link: { type: boolean }
        allow_signup: { type: boolean }
        pkce_required: { type: boolean }
        configuration:
          type: object
          additionalProperties: { type: string }

    AuthResult:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }

    ProviderSetting:
      type: object
      description: Never includes the API key — it's a caller-supplied secret, redacted in every response including create.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        provider: { type: string, example: anthropic }
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        is_default:
          type: boolean
          description: Administrative/UI marker for this organization's "main" provider setting - not consumed by job execution.

    ResolvedProviderSetting:
      type: object
      description: >-
        Unlike ProviderSetting, this includes the decrypted api_key — see
        the resolveProviderSetting operation.
      properties:
        provider: { type: string, example: mistral }
        default_model: { type: string, example: mistral-small-latest }
        base_url: { type: string }
        api_key: { type: string }
        source:
          type: string
          enum: [organization, platform]
          description: >-
            "organization" if the requesting org had its own setting;
            "platform" if it fell back to the organization currently
            flagged as the platform default.

    ProviderSettingInput:
      type: object
      required: [organization_id, provider]
      properties:
        organization_id: { type: string }
        provider: { type: string, example: anthropic }
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        api_key:
          type: string
          description: Required on create.

    # Distinct from ProviderSettingInput: the update handler's request struct
    # has neither organization_id nor provider (an existing setting's org and
    # provider are fixed; DisallowUnknownFields rejects them if sent), same
    # reasoning as every other *UpdateInput in this spec.
    ProviderSettingUpdateInput:
      type: object
      properties:
        default_model: { type: string, example: claude-sonnet-5 }
        base_url: { type: string }
        api_key:
          type: string
          description: Omit/empty to keep the existing stored key unchanged.

    WebSearchProviderSetting:
      type: object
      description: >-
        Never includes the API key — it's a caller-supplied secret, redacted
        in every response including create. No default_model field, unlike
        ProviderSetting — a web-search provider has no such concept.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username:
          type: string
          description: Only meaningful for searxng (HTTP basic auth username).

    ResolvedWebSearchProviderSetting:
      type: object
      description: >-
        Unlike WebSearchProviderSetting, this includes the decrypted
        api_key — see the resolveWebSearchProviderSetting operation.
      properties:
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username: { type: string }
        api_key: { type: string }
        source:
          type: string
          enum: [organization, platform]
          description: >-
            "organization" if the requesting org had its own setting;
            "platform" if it fell back to the organization currently
            flagged as the platform default.

    WebSearchProviderSettingInput:
      type: object
      required: [organization_id, provider]
      properties:
        organization_id: { type: string }
        provider: { type: string, example: tavily }
        base_url: { type: string }
        auth_username: { type: string }
        api_key:
          type: string
          description: Required on create.

    # Distinct from WebSearchProviderSettingInput: the update handler's
    # request struct has neither organization_id nor provider (an existing
    # setting's org and provider are fixed), same reasoning as every other
    # *UpdateInput in this spec.
    WebSearchProviderSettingUpdateInput:
      type: object
      properties:
        base_url: { type: string }
        auth_username: { type: string }
        api_key:
          type: string
          description: Omit/empty to keep the existing stored key unchanged.

    WebSearchOrgPolicy:
      type: object
      properties:
        organization_id: { type: string }
        created_by_user_id: { type: string }
        allowed_domains: { type: array, items: { type: string } }
        blocked_domains: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }

    WebSearchOrgPolicyInput:
      type: object
      required: [organization_id]
      properties:
        organization_id: { type: string }
        allowed_domains: { type: array, items: { type: string } }
        blocked_domains: { type: array, items: { type: string } }

    WorkspaceChatStreamInput:
      type: object
      required: [session_id, organization_id, provider, model, message]
      properties:
        session_id:
          type: string
          description: Client-generated - identifies one conversation across calls.
        organization_id: { type: string }
        provider: { type: string, example: anthropic }
        model: { type: string, example: claude-sonnet-5 }
        corpus_id:
          type: string
          description: Optional - enables rag_search/rag_ingest scoped to this organization's embedder when set.
        message:
          type: string
          description: The user's new message. Prior turns are remembered server-side via session_id, not resent here.

    WorkspaceChatEvent:
      type: object
      description: One line of the newline-delimited response stream.
      required: [type]
      properties:
        type:
          type: string
          enum: [text_delta, thinking_delta, tool_progress, done, error]
        delta:
          type: string
          description: Present for text_delta/thinking_delta - an incremental text fragment to append.
        tool:
          $ref: "#/components/schemas/WorkspaceChatToolProgress"
        message:
          type: string
          description: Present for the error event.

    WorkspaceChatToolProgress:
      type: object
      description: Present on tool_progress events. Emitted once per stage as the tool call happens (pending/running/completed/failed); web_search calls get a second "completed" event once the turn finishes, with the fully structured web_search field replacing the plain-text summary.
      properties:
        name: { type: string, example: web_search }
        tool_use_id: { type: string }
        stage: { type: string, enum: [pending, running, completed, failed] }
        summary:
          type: string
          description: Human-readable progress text (or a truncated result summary on completion).
        query:
          type: string
          description: The tool's input query, when it has one (e.g. web_search).
        web_search:
          $ref: "#/components/schemas/WorkspaceChatWebSearchTrace"

    WorkspaceChatWebSearchTrace:
      type: object
      properties:
        query: { type: string }
        count: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              url: { type: string }
              description: { type: string }
              source: { type: string }

    MCPServerConfig:
      type: object
      description: Never includes env/headers values — they're a caller-supplied secret, redacted in every response including create.
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string, example: internal-jira }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket, sdk], example: stdio }
        command: { type: string, description: Only meaningful for server_type=stdio. }
        args: { type: array, items: { type: string } }
        url: { type: string, description: Only meaningful for server_type=http/sse/websocket. }
        timeout_secs: { type: integer }
        icon: { type: string }

    ResolvedMCPServerConfig:
      type: object
      description: >-
        Unlike MCPServerConfig, this includes the decrypted env/headers
        maps — see the resolveMCPServerConfigs operation.
      properties:
        id: { type: string }
        name: { type: string }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket, sdk] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string } }
        timeout_secs: { type: integer }
        icon: { type: string }

    MCPServerConfigInput:
      type: object
      required: [organization_id, name]
      properties:
        organization_id: { type: string }
        name: { type: string, example: internal-jira }
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket, sdk], default: stdio }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: Encrypted at rest. Optional on create.
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Encrypted at rest. Optional on create.
        timeout_secs: { type: integer, default: 30 }
        icon: { type: string }

    # Distinct from MCPServerConfigInput: the update handler's request
    # struct has neither organization_id nor name (an existing config's
    # organization and name are fixed), same reasoning as every other
    # *UpdateInput in this spec.
    MCPServerConfigUpdateInput:
      type: object
      properties:
        display_name: { type: string }
        server_type: { type: string, enum: [stdio, http, sse, websocket, sdk] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
          description: Omit to keep the existing stored env unchanged.
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Omit to keep the existing stored headers unchanged.
        timeout_secs: { type: integer }
        icon: { type: string }

    Corpus:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string }
        description: { type: string }
        chunk_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CorpusInput:
      type: object
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
      required: [organization_id, name]

    CorpusFile:
      type: object
      properties:
        id: { type: string }
        corpus_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        status: { type: string, enum: [pending, ingested, failed] }
        chunk_count: { type: integer }
        ingested_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    IngestionJob:
      type: object
      properties:
        id: { type: string }
        corpus_id: { type: string }
        corpus_file_id: { type: string }
        filename: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        chunk_count: { type: integer }
        last_error: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SearchResponse:
      type: object
      properties:
        corpus_id: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              text: { type: string }
              score: { type: number, format: float }
              metadata: { type: object, additionalProperties: { type: string } }

    EmbedderSetting:
      type: object
      description: Never includes the API key — same redaction stance as ProviderSetting.
      properties:
        id: { type: string }
        organization_id: { type: string }
        provider: { type: string, enum: [openai, ollama] }
        model: { type: string, example: text-embedding-3-small }
        base_url: { type: string }

    EmbedderSettingInput:
      type: object
      properties:
        organization_id: { type: string }
        provider: { type: string, enum: [openai, ollama] }
        model: { type: string, example: text-embedding-3-small }
        base_url: { type: string }
        api_key:
          type: string
          description: Optional (e.g. a local Ollama needs none). Empty on update keeps the existing key unchanged.
      required: [provider, model, base_url]

    Device:
      type: object
      description: The device's bearer token is never part of this view — see RegisterDeviceResult for the one-time reveal.
      properties:
        id: { type: string }
        organization_id: { type: string }
        registered_by_user_id: { type: string }
        name: { type: string }
        platform: { type: string }
        app_version: { type: string }
        status: { type: string, enum: [active, revoked] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterDeviceResult:
      type: object
      properties:
        device: { $ref: "#/components/schemas/Device" }
        token:
          type: string
          description: Full device bearer token, shown in full only in this response.

    Job:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        created_by_user_id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, paused] }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time, nullable: true }
        next_run_at: { type: string, format: date-time, nullable: true }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_run_status:
          type: string
          enum: [queued, claimed, running, completed, failed, cancelled]
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string }
        configuration:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobInput:
      type: object
      required: [organization_id, name, trigger_type, execution_target, prompt]
      description: >-
        cron_expr is required when trigger_type=cron; interval_seconds when
        trigger_type=interval; run_at when trigger_type=once.
        target_device_id is required when execution_target=device.
        model_override is required when execution_target=cloud, format
        "provider:model" (e.g. "anthropic:claude-sonnet-5") — the provider
        prefix picks which of the organization's provider-settings to run
        against; there must be one configured (POST /provider-settings) or
        the run fails with a clear reason.
      properties:
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string, example: "0 0 * * *" }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time }
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string, example: "anthropic:claude-sonnet-5" }
        configuration:
          type: object
          additionalProperties: { type: string }

    # Distinct from JobInput: the update handler's request struct has no
    # organization_id (a job can't be moved between organizations via
    # update), same reasoning as every other *UpdateInput in this spec.
    JobUpdateInput:
      type: object
      required: [name, trigger_type, execution_target, prompt]
      properties:
        name: { type: string }
        description: { type: string }
        trigger_type: { type: string, enum: [cron, interval, once] }
        cron_expr: { type: string, example: "0 0 * * *" }
        interval_seconds: { type: integer }
        run_at: { type: string, format: date-time }
        execution_target: { type: string, enum: [cloud, device] }
        target_device_id: { type: string }
        prompt: { type: string }
        model_override: { type: string, example: "anthropic:claude-sonnet-5" }
        configuration:
          type: object
          additionalProperties: { type: string }

    Run:
      type: object
      properties:
        id: { type: string }
        job_id: { type: string }
        organization_id: { type: string }
        execution_target: { type: string, enum: [cloud, device] }
        assigned_device_id: { type: string }
        status:
          type: string
          enum: [queued, claimed, running, completed, failed, cancelled]
        queued_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        exit_reason: { type: string }
        output_text: { type: string }
        error_text: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }

    RunJob:
      type: object
      description: >-
        Minimal execution payload for a run a device currently holds —
        deliberately not the full Job (no organization_id,
        created_by_user_id, etc.).
      properties:
        name: { type: string }
        prompt: { type: string }
        model_override: { type: string }
        configuration:
          type: object
          additionalProperties: { type: string }
