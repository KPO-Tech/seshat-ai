        deliberately looser than web_search_settings.manage: any member of
        the organization can resolve "what should I use". Falls back to the
        platform default when the organization has no setting of its own
        for this provider; 404 if neither exists.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resolved web-search provider config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedWebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/web-search-provider-settings/{webSearchProviderSettingID}:
    parameters:
      - name: webSearchProviderSettingID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Update a web-search provider setting
      description: >-
        An empty/omitted api_key leaves the stored credential unchanged.
        Unlike creation, organization_id/provider are not part of this body
