                    items: { $ref: "#/components/schemas/WebSearchProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Store credentials for one web-search provider
      description: >-
        Requires web_search_settings.manage or organization.manage. One
        provider per organization — creating a second setting for the same
        (organization, provider) pair is rejected; use update instead.
        auth_username is only meaningful for searxng (HTTP basic auth); the
        api_key is AES-256-GCM encrypted at rest and never echoed back, not
        even in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebSearchProviderSettingInput" }
      responses:
        "201":
          description: Web-search provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSearchProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/web-search-provider-settings/resolve:
    get:
      operationId: resolveWebSearchProviderSetting
      tags: [web-search-provider-settings]
      summary: Resolve the effective, usable web-search provider config for an organization
      description: >-
        Unlike every other web-search-provider-settings endpoint, this
        INCLUDES the decrypted api_key (and auth_username, for searxng) —
        the point is for a connected seshat-backend to actually call the
