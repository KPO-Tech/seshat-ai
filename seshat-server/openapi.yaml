        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      tags: [sessions]
      summary: Revoke one session
      description: >
        Platform admin may revoke any session; a regular user may only
        revoke one of their own.
      parameters:
