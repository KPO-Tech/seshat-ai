openapi: 3.0.3
info:
  title: Seshat Server API
  description: >
    Cloud control plane for Seshat: auth, organizations, memberships, roles,
    permissions, groups, policy bindings, invitations, sessions, applications,
    providers and audit trail. Devices, scheduled jobs and runs are planned
    but not implemented yet.
  version: "1.0.0"
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and bootstrap-status checks, no authentication required.
  - name: auth
    description: Bootstrap, login, logout and session-principal resolution.
  - name: organizations
    description: Tenant boundary that every other domain is scoped to.
  - name: users
    description: Platform-level user accounts (distinct from per-org memberships).
  - name: roles-and-permissions
    description: Static role and permission catalogs.
  - name: memberships
    description: Binds a user to an organization under a role.
  - name: invitations
    description: Pending or resolved organization access invites.
  - name: groups
    description: Organization-local user collections used as policy-binding subjects.
  - name: policy-bindings
    description: Grants a set of permissions to a user, group or role.
  - name: sessions
    description: Active bearer-token logins.
  - name: audit
    description: Read-only audit trail of control-plane mutations.
  - name: preferences
    description: >-
      A user's own personal settings — no organization, no hierarchy, self-service
      only (same trust level as GET/PUT /auth/me).
  - name: memories
    description: >-
      A user's own flat personal memory list (facts, preferences, instructions
      noted for later) — no organization, self-service only, same trust level
      as preferences. Distinct from the long-term memory graph (see the
      memory-graph tag) — this is a simple key/value-ish list, not entities/
      relations.
  - name: memory-graph
    description: >-
      A user's own long-term memory knowledge graph (entities/observations/
      relations) — self-service only, no organization. Search is a
      case-insensitive substring match over everything the user has, the
      same algorithm as seshat-backend's local implementation — this is
      deliberately not a vector/embedding relevance system.
  - name: skill-repos
    description: >-
      An organization's curated list of recommended skill repo URLs. Authorship
      and execution of skills stay local to seshat-backend — this is purely a
      bookmarked-URL catalog it fetches to enrich its own local skill-repo list.
  - name: agent-presets
    description: >-
      An organization's shared catalog of agent presets (system prompt, model,
      permission mode, tools). Purely additive: seshat-backend's own local,
      unscoped agent_definitions table is untouched — this is one more source
      resolved at query time alongside it and the SDK's built-in registry,
      never a replacement.
  - name: quota-usage
    description: >-
      A user's own personal usage counters (queries/files/ingestions, per day
      and per month) — no organization, self-service only, same trust level as
      preferences. Pure counting, never an enforced limit: there is no
      plan/tier concept anywhere yet.
  - name: applications
    description: OAuth/OIDC client applications registered with the control plane.
  - name: providers
    description: Upstream identity providers (OIDC/OAuth2/SAML).
  - name: provider-settings
    description: >-
      Per-organization LLM provider credentials (Anthropic, OpenAI, ...) —
      distinct from providers (OAuth/OIDC identity), these are what unblocks
      execution_target=cloud jobs.
  - name: web-search-provider-settings
    description: >-
      Per-organization web-search provider credentials (Tavily, Exa, Jina,
      LangSearch, SearXNG) — a separate domain from provider-settings (LLM
      credentials): no default_model concept applies here, and SearXNG needs
      a second credential field (auth_username) no LLM provider has. Read
      (list/resolve) is open to any org member; write requires
      web_search_settings.manage.
  - name: web-search-org-policy
    description: >-
      An organization's allowed/blocked domain policy for web search,
      merged into every connected member's local search settings — blocked
      domains are always applied, allowed domains are additive.
  - name: mcp-server-configs
    description: >-
      An organization's shared MCP server definitions (stdio/http/sse) —
      config only, execution always happens locally on the connected
      member's own machine, never here. Read/resolve is open to any org
      member; write requires mcp_registry.manage. A connected
      seshat-backend requires the user to explicitly approve each server
      before loading it locally (stdio servers spawn an arbitrary command
      on the user's machine).
  - name: devices
    description: Registered seshat-backend (local desktop) instances that the cloud can target.
  - name: jobs
    description: Scheduled automation definitions (cron/interval/once, cloud- or device-targeted).
  - name: runs
    description: Individual executions of a job.
  - name: device-protocol
    description: >-
      Device-bearer-token-authenticated endpoints (a registered device's own
      token, not a user session) used by seshat-backend to claim and report
      on its assigned runs.

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: seshat-server }
                  mode: { type: string, example: iam-core }

  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      tags: [system]
      summary: Check whether the platform has been bootstrapped
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }

  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapPlatform
      tags: [auth]
      summary: Create the first platform admin, organization and session
      description: >
        One-time only: fails with 409 once any user already exists. Not
        rate-limited (repeated calls after init just fail a cheap existence
        check).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name, organization_name, organization_slug]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_name: { type: string }
                organization_slug: { type: string }
      responses:
        "201":
          description: Platform bootstrapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange email/password for a bearer session token
      description: >
        Rate limited to 5 attempts/minute per client IP (burst 5); beyond
        that, returns 429 before even checking credentials. Every attempt
        (success or failure) is written to the audit trail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: Resolve the current session's principal
      responses:
        "200":
          description: Current user, memberships, visible organizations and session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the session that authenticated this request
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations visible to the caller
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      organizations:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization (self-serve)
      description: >
        Any authenticated user may create an organization; the caller is
        attached as its owner automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationID}:
    parameters:
      - $ref: "#/components/parameters/organizationIDPath"
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get one organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization settings
      description: Requires `organization.manage` (owner or admin role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete an organization
      description: >
        Requires `organization.delete` — owner only, not admin. Cascades
        memberships, applications, providers, invitations, groups and policy
        bindings scoped to the organization. Audit history is kept.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/set-default:
    post:
      operationId: setOrganizationDefault
      tags: [organizations]
      summary: Flag this organization as the platform default (platform admin only)
      description: >
        Its own ProviderSetting/EmbedderSetting rows become the fallback
        used by every other organization with no config of its own. Clears
        the flag from whichever organization currently holds it.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/unset-default:
    post:
      operationId: unsetOrganizationDefault
      tags: [organizations]
      summary: Clear the platform-default flag from this organization (platform admin only)
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/activate:
    post:
      operationId: activateOrganization
      tags: [organizations]
      summary: Mark this organization active (platform admin only)
      description: Administrative/visual only for now - not enforced on any request path.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations/{organizationID}/deactivate:
    post:
      operationId: deactivateOrganization
      tags: [organizations]
      summary: Mark this organization inactive (platform admin only)
      description: Administrative/visual only for now - not enforced on any request path.
      parameters:
        - $ref: "#/components/parameters/organizationIDPath"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/docling-status:
    get:
      operationId: getDoclingStatus
      tags: [platform]
      summary: Whether this server has a docling-serve instance configured (platform admin only)
      description: >-
        docling-serve is a shared, server-wide setting (SESHAT_SERVER_DOCLING_URL),
        not something any organization configures for itself - there's no
        per-organization equivalent. The URL isn't a secret (shared
        infrastructure, not a credential).
      responses:
        "200":
          description: Docling status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (platform admin only)
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      users:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (platform admin only)
      description: >
        If `organization_id` is set, also creates a membership with `role`
        (default `member`) in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_id: { type: string }
                role: { type: string, enum: [owner, admin, member, viewer] }
                is_admin:
                  type: boolean
                  description: Grants platform-wide admin privileges.
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userIDPath"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: Platform admin, or the user viewing themself.
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (platform admin only)
      description: Cannot demote the last platform admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                is_admin: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (platform admin only)
      description: >
        Cascades memberships and sessions. Cannot delete the last admin or
        the currently authenticated admin.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [users, sessions]
      summary: Revoke all sessions for one user
      description: Platform admin for any user, or a user targeting themself.
      parameters:
        - $ref: "#/components/parameters/userIDPath"
      responses:
        "200":
          description: Revocation count
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [roles-and-permissions]
      summary: List the role catalog
      description: >
        Without `organization_id`, only the 4 built-in system roles (owner,
        admin, member, viewer — `system: true`, not editable/deletable) are
        returned. With `organization_id`, the organization's custom roles
        (`system: false`) are appended. Not paginated — bounded by how many
        roles one organization defines, not event volume.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRole
      tags: [roles-and-permissions]
      summary: Create a custom role for an organization
      description: >
        Requires `roles.manage` or `organization.manage`. `code` must be
        lowercase letters/digits/hyphen/underscore and cannot reuse a
        reserved system role code (owner/admin/member/viewer).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/roles/{roleCode}:
    parameters:
      - name: roleCode
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRole
      tags: [roles-and-permissions]
      summary: Get a role
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateRole
      tags: [roles-and-permissions]
      summary: Update a custom role
      description: >
        Requires `roles.manage` or `organization.manage`. System roles
        return 409. Renaming `code` cascades to every membership,
        invitation and policy binding referencing the old code, in one
        transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteRole
      tags: [roles-and-permissions]
      summary: Delete a custom role
      description: >
        Requires `roles.manage` or `organization.manage`. System roles,
        roles still assigned to a membership, and roles with active
        invitations all return 409.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags: [roles-and-permissions]
      summary: List the permission catalog
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List memberships
      description: >
        Platform admin sees everyone's; an org manager sees their org's
        memberships; a regular user sees only their own.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: user_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      memberships:
                        type: array
                        items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMembership
      tags: [memberships]
      summary: Add an existing user to an organization
      description: Requires `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, user_id, role]
              properties:
                organization_id: { type: string }
                user_id: { type: string }
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/memberships/{membershipID}:
    parameters:
      - name: membershipID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMembership
      tags: [memberships]
      summary: Get a membership
      description: Org manager, platform admin, or the member themself.
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateMembership
      tags: [memberships]
      summary: Change a membership's role
      description: >
        Requires `members.manage` or `organization.manage`. Cannot demote the
        last owner of an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteMembership
      tags: [memberships]
      summary: Remove a membership
      description: >
        An org manager may remove any member; any user may remove their own
        membership to leave the organization. Cannot remove the last owner.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List invitations
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      invitations:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite an email to join an organization
      description: >
        Requires `invitations.manage`, `members.manage` or
        `organization.manage`. Rejects a duplicate pending invite or an email
        already belonging to a member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, email, role]
              properties:
                organization_id: { type: string }
                email: { type: string, format: email }
                role:
                  type: string
                  description: A system role code (owner/admin/member/viewer) or a custom role code defined for this organization.
                expires_in_days: { type: integer, default: 7 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/{invitationID}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get an invitation
      description: Org manager, platform admin, or the invited email's owner.
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/{invitationID}/revoke:
    post:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Redeem a pending invitation for the authenticated user
      description: >
        The invitation's email must match the authenticated user's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: New membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      groups:
                        type: array
                        items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: Requires `groups.manage`, `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group
      description: Requires `groups.read`, `groups.manage`, `members.manage` or `organization.manage`.
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        group cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupUpdateInput" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      description: Also removes any policy bindings that target this group.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-bindings:
    get:
      operationId: listPolicyBindings
      tags: [policy-bindings]
      summary: List policy bindings
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Policy binding list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      policy_bindings:
                        type: array
                        items: { $ref: "#/components/schemas/PolicyBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createPolicyBinding
      tags: [policy-bindings]
      summary: Grant permissions to a user, group or role
      description: Requires `policies.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyBindingInput" }
      responses:
        "201":
          description: Policy binding created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-bindings/{bindingID}:
    parameters:
      - name: bindingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPolicyBinding
      tags: [policy-bindings]
      summary: Get a policy binding
      description: Requires `policies.read`, `policies.manage` or `organization.manage`.
      responses:
        "200":
          description: Policy binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePolicyBinding
      tags: [policy-bindings]
      summary: Update a policy binding
      description: >
        Unlike creation, `organization_id` is not part of this body — a
        policy binding cannot be moved between organizations via update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyBindingUpdateInput" }
      responses:
        "200":
          description: Updated policy binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePolicyBinding
      tags: [policy-bindings]
      summary: Delete a policy binding
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions
      description: >
        Platform admin sees everyone's sessions; a regular user always sees
        only their own, regardless of the `user_id` filter passed.
      parameters:
        - name: user_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      sessions:
                        type: array
                        items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sessions/{sessionID}:
    delete:
      operationId: revokeSession
      tags: [sessions]
      summary: Revoke one session
      description: >
        Platform admin may revoke any session; a regular user may only
        revoke one of their own.
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events
      description: Requires `audit.read`, `organization.manage` or `members.manage` for the relevant organization.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: actor_user_id
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      audit_events:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/users/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [preferences]
      summary: Get my own preferences
      description: >-
        Self-service only — there is no {userID} variant, a preference only
        ever means "mine." Returns a zero-value record (not 404) if none has
        been saved yet.
      responses:
        "200":
          description: My preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateMyPreferences
      tags: [preferences]
      summary: Create or replace my own preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memories:
    get:
      operationId: listMyMemories
      tags: [memories]
      summary: List my own memories
      description: Self-service only. Ordered by importance then recency, most important/most recent first.
      responses:
        "200":
          description: My memories
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items: { $ref: "#/components/schemas/UserMemory" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createMyMemory
      tags: [memories]
      summary: Create a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserMemoryInput" }
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMemory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteAllMyMemories
      tags: [memories]
      summary: Delete every one of my own memories
      responses:
        "200":
          description: Number deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memories/{memoryID}:
    parameters:
      - name: memoryID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateMyMemory
      tags: [memories]
      summary: Update one of my own memories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserMemoryUpdateInput" }
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMemory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMyMemory
      tags: [memories]
      summary: Delete one of my own memories
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/me/memory-graph/entities:
    post:
      operationId: upsertMyMemoryEntities
      tags: [memory-graph]
      summary: Create entities that don't exist yet (deduplicated by name)
      description: >-
        An entity whose name already exists is left untouched (skipped, not
        updated) — matches the underlying reference implementation. Returns
        only the entities that were actually inserted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entities:
                  type: array
                  items: { $ref: "#/components/schemas/MemoryEntityInput" }
      responses:
        "200":
          description: Entities actually created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryEntity" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/observations:
    post:
      operationId: addMyMemoryObservations
      tags: [memory-graph]
      summary: Append observations to existing entities
      description: Duplicate observation strings (already present on that entity) are silently skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observations:
                  type: array
                  items: { $ref: "#/components/schemas/MemoryObservationInput" }
      responses:
        "200":
          description: What was actually added, per entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MemoryObservationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/me/memory-graph/search:
    get:
      operationId: searchMyMemoryNodes
      tags: [memory-graph]
      summary: Search my own memory graph
      description: >-
        Case-insensitive substring match across entity names, entity types,
        and observation content — not a vector/relevance search. An empty
        query returns everything.
      parameters:
        - name: query
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching entities plus relations touching them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/open:
    post:
      operationId: openMyMemoryNodes
      tags: [memory-graph]
      summary: Get specific entities by exact name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Matching entities plus relations touching them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryGraph" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/memory-graph/context:
    get:
      operationId: getMyMemoryContext
      tags: [memory-graph]
      summary: Retrieve memory relevant to a query, formatted for prompt injection
      description: >-
        Searches nodes matching query and formats the result as a Markdown
        block capped to approximately max_tokens (rough estimate, 4 chars ≈
        1 token). Returns an empty string when there is nothing relevant.
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: max_tokens
          in: query
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Formatted context block
          content:
            application/json:
              schema:
                type: object
                properties:
                  context: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/users/me/workspace/chat/stream:
    post:
      operationId: streamWorkspaceChat
      tags: [workspace-chat]
      summary: Send a message to a personal Workspace Chat session and stream back the reply
      description: >-
        A personal, user-scoped playground for trying providers/models/tools
        live against a real LLM (web_search, rag_search, read_document_url),
        distinct from the async cloud job scheduler. The response body is
        newline-delimited JSON (one WorkspaceChatEvent object per line), not
        a JSON document — read it as a stream, not with a single JSON parse.
        session_id is client-generated and identifies one conversation;
        reusing it across calls continues the same in-memory SDK session
        (recent history remembered) until it's evicted after 2 hours of
        inactivity. Sessions are not persisted to the database - this is a
        transient test surface, not a durable chat history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceChatStreamInput" }
      responses:
        "200":
          description: Newline-delimited stream of WorkspaceChatEvent objects
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/WorkspaceChatEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/skill-repos:
    get:
      operationId: listSkillRepos
      tags: [skill-repos]
      summary: List an organization's curated skill repos
      description: >-
        Open to any member of the organization, not gated behind a specific
        permission — these are public repo URLs, nothing secret to protect.
        A caller who isn't a member of the organization at all is rejected.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Skill repo list
          content:
            application/json:
              schema:
                type: object
                properties:
                  skill_repos:
                    type: array
                    items: { $ref: "#/components/schemas/SkillRepo" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSkillRepo
      tags: [skill-repos]
      summary: Add a skill repo to the organization's registry
      description: Requires skills_registry.manage or organization.manage. One entry per (organization, name).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillRepoInput" }
      responses:
        "201":
          description: Skill repo created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillRepo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/skill-repos/{skillRepoID}:
    parameters:
      - name: skillRepoID
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateSkillRepo
      tags: [skill-repos]
