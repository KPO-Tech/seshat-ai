openapi: 3.0.3
info:
  title: Seshat Server API
  description: >
    Cloud control plane for Seshat: auth, organizations, memberships, roles,
    permissions, groups, policy bindings, invitations, sessions, applications,
    providers and audit trail. Devices, scheduled jobs and runs are planned
    but not implemented yet.
  version: "1.0.0"
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and bootstrap-status checks, no authentication required.
  - name: auth
    description: Bootstrap, login, logout and session-principal resolution.
  - name: organizations
    description: Tenant boundary that every other domain is scoped to.
  - name: users
    description: Platform-level user accounts (distinct from per-org memberships).
  - name: roles-and-permissions
    description: Static role and permission catalogs.
  - name: memberships
    description: Binds a user to an organization under a role.
  - name: invitations
    description: Pending or resolved organization access invites.
  - name: groups
    description: Organization-local user collections used as policy-binding subjects.
  - name: policy-bindings
    description: Grants a set of permissions to a user, group or role.
  - name: sessions
    description: Active bearer-token logins.
  - name: audit
    description: Read-only audit trail of control-plane mutations.
  - name: applications
    description: OAuth/OIDC client applications registered with the control plane.
  - name: providers
    description: Upstream identity providers (OIDC/OAuth2/SAML).
  - name: provider-settings
    description: >-
      Per-organization LLM provider credentials (Anthropic, OpenAI, ...) —
      distinct from providers (OAuth/OIDC identity), these are what unblocks
      execution_target=cloud jobs.
  - name: devices
    description: Registered seshat-backend (local desktop) instances that the cloud can target.
  - name: jobs
    description: Scheduled automation definitions (cron/interval/once, cloud- or device-targeted).
  - name: runs
    description: Individual executions of a job.
  - name: device-protocol
    description: >-
      Device-bearer-token-authenticated endpoints (a registered device's own
      token, not a user session) used by seshat-backend to claim and report
      on its assigned runs.

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [system]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: seshat-server }
                  mode: { type: string, example: iam-core }

  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      tags: [system]
      summary: Check whether the platform has been bootstrapped
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }

  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrapPlatform
      tags: [auth]
      summary: Create the first platform admin, organization and session
      description: >
        One-time only: fails with 409 once any user already exists. Not
        rate-limited (repeated calls after init just fail a cheap existence
        check).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name, organization_name, organization_slug]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_name: { type: string }
                organization_slug: { type: string }
      responses:
        "201":
          description: Platform bootstrapped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange email/password for a bearer session token
      description: >
        Rate limited to 5 attempts/minute per client IP (burst 5); beyond
        that, returns 429 before even checking credentials. Every attempt
        (success or failure) is written to the audit trail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: Resolve the current session's principal
      responses:
        "200":
          description: Current user, memberships, visible organizations and session
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  memberships:
                    type: array
                    items: { $ref: "#/components/schemas/Membership" }
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the session that authenticated this request
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations visible to the caller
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Organization list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      organizations:
                        type: array
                        items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create an organization (self-serve)
      description: >
        Any authenticated user may create an organization; the caller is
        attached as its owner automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/organizations/{organizationID}:
    parameters:
      - $ref: "#/components/parameters/organizationIDPath"
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get one organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization settings
      description: Requires `organization.manage` (owner or admin role).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInput" }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteOrganization
      tags: [organizations]
      summary: Delete an organization
      description: >
        Requires `organization.delete` — owner only, not admin. Cascades
        memberships, applications, providers, invitations, groups and policy
        bindings scoped to the organization. Audit history is kept.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (platform admin only)
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      users:
                        type: array
                        items: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user (platform admin only)
      description: >
        If `organization_id` is set, also creates a membership with `role`
        (default `member`) in the same call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                display_name: { type: string }
                organization_id: { type: string }
                role: { type: string, enum: [owner, admin, member, viewer] }
                is_admin:
                  type: boolean
                  description: Grants platform-wide admin privileges.
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userIDPath"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: Platform admin, or the user viewing themself.
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (platform admin only)
      description: Cannot demote the last platform admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string }
                is_admin: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (platform admin only)
      description: >
        Cascades memberships and sessions. Cannot delete the last admin or
        the currently authenticated admin.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{userID}/sessions:
    delete:
      operationId: revokeUserSessions
      tags: [users, sessions]
      summary: Revoke all sessions for one user
      description: Platform admin for any user, or a user targeting themself.
      parameters:
        - $ref: "#/components/parameters/userIDPath"
      responses:
        "200":
          description: Revocation count
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [roles-and-permissions]
      summary: List the role catalog
      description: >
        Static catalog (owner, admin, member, viewer) — not stored/editable
        per organization yet. Pass `organization_id` to also verify the
        caller can access that org.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags: [roles-and-permissions]
      summary: List the permission catalog
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items: { $ref: "#/components/schemas/Permission" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      summary: List memberships
      description: >
        Platform admin sees everyone's; an org manager sees their org's
        memberships; a regular user sees only their own.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: user_id
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Membership list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      memberships:
                        type: array
                        items: { $ref: "#/components/schemas/Membership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMembership
      tags: [memberships]
      summary: Add an existing user to an organization
      description: Requires `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, user_id, role]
              properties:
                organization_id: { type: string }
                user_id: { type: string }
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/memberships/{membershipID}:
    parameters:
      - name: membershipID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMembership
      tags: [memberships]
      summary: Get a membership
      description: Org manager, platform admin, or the member themself.
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateMembership
      tags: [memberships]
      summary: Change a membership's role
      description: >
        Requires `members.manage` or `organization.manage`. Cannot demote the
        last owner of an organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteMembership
      tags: [memberships]
      summary: Remove a membership
      description: >
        An org manager may remove any member; any user may remove their own
        membership to leave the organization. Cannot remove the last owner.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List invitations
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, revoked, expired] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      invitations:
                        type: array
                        items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite an email to join an organization
      description: >
        Requires `invitations.manage`, `members.manage` or
        `organization.manage`. Rejects a duplicate pending invite or an email
        already belonging to a member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, email, role]
              properties:
                organization_id: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [owner, admin, member, viewer] }
                expires_in_days: { type: integer, default: 7 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/{invitationID}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get an invitation
      description: Org manager, platform admin, or the invited email's owner.
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invitations/{invitationID}/revoke:
    post:
      operationId: revokeInvitation
      tags: [invitations]
      summary: Revoke a pending invitation
      parameters:
        - name: invitationID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Redeem a pending invitation for the authenticated user
      description: >
        The invitation's email must match the authenticated user's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: New membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List groups
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      groups:
                        type: array
                        items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      description: Requires `groups.manage`, `members.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/groups/{groupID}:
    parameters:
      - name: groupID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group
      description: Requires `groups.read`, `groups.manage`, `members.manage` or `organization.manage`.
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Update a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group
      description: Also removes any policy bindings that target this group.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/policy-bindings:
    get:
      operationId: listPolicyBindings
