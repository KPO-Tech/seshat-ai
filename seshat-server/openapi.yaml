  /api/v1/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Application list. `client_secret` is redacted on every entry
            except the one returned by the create call below.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      applications:
                        type: array
                        items: { $ref: "#/components/schemas/Application" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createApplication
      tags: [applications]
      summary: Register a client application
      description: >
        Requires `applications.manage` or `organization.manage`. The server
        generates `client_id`/`client_secret`; this response is the only
        place the real `client_secret` is ever returned in full.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Application created (client_secret shown in full once)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/applications/{applicationID}:
    parameters:
      - name: applicationID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application
      description: Requires `applications.read`, `applications.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application
      description: >
        `client_secret` is immutable via this endpoint (not part of the
        request body) and redacted in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List upstream identity providers
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/order"
        - $ref: "#/components/parameters/q"
      responses:
        "200":
          description: >
            Provider list. `client_secret` is always redacted — the value is
            caller-supplied, so it is never echoed back in full, even at
            creation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      providers:
                        type: array
                        items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProvider
      tags: [providers]
      summary: Register an upstream identity provider
      description: Requires `providers.manage` or `organization.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Provider created (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/providers/{providerID}:
    parameters:
      - name: providerID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider
      description: Requires `providers.read`, `providers.manage` or `organization.manage`. `client_secret` is redacted.
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Updated provider (client_secret redacted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      description: Fails while any application still references this provider.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/provider-settings:
    get:
      operationId: listProviderSettings
      tags: [provider-settings]
      summary: List LLM providers configured for an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        provider_settings.read/manage/organization.manage gets an empty
        list, not a 403. The API key is never included, in this or any
        other response.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProviderSetting
      tags: [provider-settings]
      summary: Store credentials for one LLM provider
      description: >-
        Requires provider_settings.manage or organization.manage. One
        provider per organization — creating a second setting for the same
        (organization, provider) pair is rejected; use update instead. The
        api_key is AES-256-GCM encrypted at rest and never echoed back, not
        even in this response — it's a caller-supplied secret, the same
        redaction rule already applied to Provider.client_secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingInput" }
      responses:
        "201":
          description: Provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/provider-settings/{providerSettingID}:
    parameters:
      - name: providerSettingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProviderSetting
      tags: [provider-settings]
      summary: Get a provider setting
      responses:
        "200":
          description: Provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProviderSetting
      tags: [provider-settings]
      summary: Update a provider setting
      description: An empty/omitted api_key leaves the stored credential unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderSettingInput" }
      responses:
        "200":
          description: Updated provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteProviderSetting
      tags: [provider-settings]
      summary: Delete a provider setting
      description: Cloud jobs depending on this provider will start failing at execution time with a clear reason; existing jobs are not touched or deleted.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/platform/provider-settings:
    get:
      operationId: listPlatformProviderSettings
      tags: [platform-provider-settings]
      summary: List the platform-wide default LLM credentials
      description: >-
        Superadmin-only (platform admin, User.is_admin). Unlike every
        org-scoped list endpoint, a non-admin caller gets 403, not an empty
        list — there is no organization to scope visibility to. The API key
        is never included, in this or any other response.
      responses:
        "200":
          description: Platform provider setting list
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform_provider_settings:
                    type: array
                    items: { $ref: "#/components/schemas/PlatformProviderSetting" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPlatformProviderSetting
      tags: [platform-provider-settings]
      summary: Store the platform-wide default credentials for one LLM provider
      description: >-
        Superadmin-only. One row per provider, globally (not scoped to any
        organization) — creating a second setting for the same provider is
        rejected; use update instead. A cloud-targeted job falls back to
        this when its own organization has no provider-settings configured
        for the requested provider (the hybrid BYOK/managed model — an org
        can bring its own key, or use Seshat's default without configuring
        anything). The api_key is AES-256-GCM encrypted at rest and never
        echoed back, not even in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformProviderSettingInput" }
      responses:
        "201":
          description: Platform provider setting created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/platform/provider-settings/{platformProviderSettingID}:
    parameters:
      - name: platformProviderSettingID
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPlatformProviderSetting
      tags: [platform-provider-settings]
      summary: Get a platform provider setting
      description: Superadmin-only.
      responses:
        "200":
          description: Platform provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProviderSetting" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePlatformProviderSetting
      tags: [platform-provider-settings]
      summary: Update a platform provider setting
      description: Superadmin-only. An empty/omitted api_key leaves the stored credential unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformProviderSettingInput" }
      responses:
        "200":
          description: Updated platform provider setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProviderSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePlatformProviderSetting
      tags: [platform-provider-settings]
      summary: Delete a platform provider setting
      description: >-
        Superadmin-only. Any cloud job that was relying on this as its
        fallback (no org-level provider-settings of its own) starts failing
        at execution time with a clear reason; existing jobs are not
        touched or deleted.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices in an organization
      description: >-
        Scoped visibility like every other list endpoint: a caller lacking
        devices.read/devices.manage/organization.manage gets an empty list,
        not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
                  count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: registerDevice
      tags: [devices]
      summary: Register the caller's own machine as a device
      description: >-
        Self-service: any org member may register a device for themselves.
        The bearer token is shown in full only in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, name]
              properties:
                organization_id: { type: string }
                name: { type: string }
                platform: { type: string, example: darwin }
                app_version: { type: string, example: "1.4.0" }
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterDeviceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/devices/{deviceID}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoke a device
      description: Requires devices.manage/organization.manage, or being the user who registered the device.
      parameters:
        - name: deviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/device/heartbeat:
    post:
      operationId: deviceHeartbeat
      tags: [device-protocol]
      summary: Report device liveness
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs in an organization
      description: Scoped visibility — a caller lacking jobs.read/jobs.manage/organization.manage gets an empty list, not a 403.
      parameters:
        - $ref: "#/components/parameters/organizationIDQuery"
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
