<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 500" fill="none">
<defs>
 <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111A20"/><stop offset=".55" stop-color="#273138"/><stop offset="1" stop-color="#151F26"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#FF922F"/><stop offset=".56" stop-color="#FA7416"/><stop offset="1" stop-color="#E95B0A"/></linearGradient>
 <linearGradient id="archL" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202A31" offset="0"/><stop stop-color="#202A31" offset=".25"/><stop stop-color="#8A492B" offset=".62"/><stop stop-color="#FF7C18" offset=".94"/></linearGradient>
 <linearGradient id="archR" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#202A31" offset="0"/><stop stop-color="#202A31" offset=".25"/><stop stop-color="#8A492B" offset=".62"/><stop stop-color="#FF7C18" offset=".94"/></linearGradient>
 <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343034"/><stop offset="1" stop-color="#241E1C"/></linearGradient>
</defs>
<!-- Left page: open top edge and flowing lower page -->
<path d="M80 178 C57 171 37 180 37 201 L37 378 C37 398 48 403 66 397 C125 378 191 378 259 422" stroke="url(#charcoal)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
