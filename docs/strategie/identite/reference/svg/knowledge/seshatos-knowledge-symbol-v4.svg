<!-- Two upper sweeping book-fountain arches -->
<path d="M125 147 C177 119 225 153 257 199 C288 244 298 308 304 364" stroke="url(#archL)" stroke-width="25" stroke-linecap="round"/>
<path d="M535 147 C483 119 435 153 403 199 C372 244 362 308 356 364" stroke="url(#archR)" stroke-width="25" stroke-linecap="round"/>
<!-- Curved knowledge branches -->
<path d="M155 225 C218 251 271 304 298 361" stroke="url(#orange)" stroke-width="21" stroke-linecap="round"/>
<path d="M505 225 C442 251 389 304 362 361" stroke="url(#orange)" stroke-width="21" stroke-linecap="round"/>
<path d="M155 320 C209 330 246 350 273 380" stroke="url(#orange)" stroke-width="17" stroke-linecap="round"/>
<path d="M505 320 C451 330 414 350 387 380" stroke="url(#orange)" stroke-width="17" stroke-linecap="round"/>
<!-- Central stem -->
<path d="M316 80 L344 80 L344 360 Q344 374 330 374 Q316 374 316 360 Z" fill="#FA7416"/>
<!-- Six terminals and the central terminal -->
<circle cx="330" cy="52" r="39" fill="url(#orange)"/>
<circle cx="150" cy="217" r="31" fill="url(#orange)"/>
<circle cx="510" cy="217" r="31" fill="url(#orange)"/>
<circle cx="150" cy="312" r="29" fill="url(#orange)"/>
<circle cx="510" cy="312" r="29" fill="url(#orange)"/>
<!-- Center punctuation -->
