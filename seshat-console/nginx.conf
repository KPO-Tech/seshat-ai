server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches seshat-server's own upload cap (maxUploadBytes in
    # internal/server/api/knowledge.go) - nginx's 1M default otherwise
    # rejects uploads the backend would accept, with an unhelpful HTML 413
    # page (not JSON) that the console can't turn into a useful error
    # message.
    client_max_body_size 25M;

    # Reverse-proxy the API to the seshat-server container so the browser
    # only ever talks to this one origin — sidesteps CORS entirely, same
    # idea as the Vite dev proxy (vite.config.ts) for local development.
    location /api/ {
        proxy_pass http://seshat-server:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same upstream as /api/ above, but this one long-lived streaming
    # response needs a read timeout well past nginx's 60s default - a real
    # multi-tool-call turn can go quiet for over a minute at a stretch (a
    # browser-tool call downloading Chromium on its first use, or just a
    # slow page fetch) with zero bytes flushed in between, and nginx closes
    # an upstream connection that goes quiet that long regardless of how
    # many chunks it already sent (this is the nginx-side twin of
    # workspace_chat.go's own SetWriteDeadline(time.Time{}) fix, on the
    # Go server's http.Server.WriteTimeout - fixing one without the other
    # still cuts the stream off, just at a different layer). Longest-prefix
    # match means this exact-path location wins over the generic /api/
    # block above regardless of declaration order, so nothing else changes.
    location = /api/v1/users/me/workspace/chat/stream {
        proxy_pass http://seshat-server:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://seshat-server:8081;
    }

    # Hashed filenames (index-<hash>.js) change on every build, so these can
    # be cached indefinitely - a stale cached copy is never served under a
    # new build's URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html has no hash in its name and references the current build's
    # asset hashes, so it must always be revalidated - otherwise a browser
    # can keep serving yesterday's index.html (pointing at yesterday's JS)
    # from disk cache after a redeploy, with no visible sign anything is wrong.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router owns client-side routing, so any unknown
    # path must still serve index.html rather than a raw nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
